<!DOCTYPE html>
<!-- trpg-frontend ver: 20261019-0915 (deploy marker) -->
<!-- 對應 API: 2026-10-19.2 -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="trpg-ui" content="argbox-v1">
<!-- CSP（owner 2026-10-08 拍板「加白名單」）：**只收緊對外連線這一條**——頁面能連的目標限
     「自己（桌服務，同源）」＋「翻譯服務 origin」。其餘（script／style／img／media…）一律不宣告，
     維持原狀，免誤傷。
     為什麼這樣就夠：翻譯是這一頁唯一的跨源外送（見「即時翻譯」節 §TR_URL），把它鎖死在白名單裡，
     即使頁面被塞了腳本也送不出去；桌服務本來就走同源相對路徑（`'self'` 已覆蓋）。
     ⚠ 網址加 `?tr=…` 覆蓋翻譯服務位址會被這條擋掉——協作端 2026-10-05 已明示接受（那是他除錯用的）。 -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' http://127.0.0.1:8982">
<meta name="theme-color" content="#4b5082">   <!-- 手機網址列顏色；applyTheme 依主題改它的 content（取自 CSS 的 --theme-color） -->
<title>TRPG 桌</title>
<style>
/* ==========================================================================
   设计系统　v3（浅色＝默认：白卡＋青绿＋深靛蓝）
   色票：白卡 #ffffff/#f7f6fb、
   主色青绿 #0cb4c0/#00b4b4、深靛蓝 #484878/#424964、浅蓝灰 #e7ebf1、
   淡青星光 #aad5db。深色主题保留为可选（html[data-theme="dark"]）。
   ========================================================================== */
:root{
  color-scheme:light;                  --bg-star:rgba(120,166,196,.34);
  --surface:#ffffff;  
   
    
  --acc:#0abec5; --acc-h:#10c7cd; --acc-d:#007d88; --acc-l:#7fe3e8; --acc-ink:#03343a;
   --lav:#7050bb; --star:#a2660f; --good:#147f5d; --bad:#c33f3a; --warn:#9e6405; --pur:#7050bb;
  --bar-grad:linear-gradient(180deg,#4b5082,#3f4470); --bar-tx:#ffffff; --bar-line:rgba(255,255,255,.14);
  
  --tint:rgba(72,72,120,.07); --tint-line:rgba(72,72,120,.16); --tint-hover:rgba(72,72,120,.12);
  --hair:1px dashed rgba(72,72,120,.15);
  --input-bg:#ffffff; --input-line:#d9e1f0;
  --row-hover:rgba(12,180,192,.06);
  --bad-bg:rgba(195,63,58,.09); --bad-line:rgba(195,63,58,.38); --bad-tx:#9c2f2a;
  --hold-bg:rgba(158,100,5,.10); --hold-line:rgba(158,100,5,.42); --hold-tx:#7a4d04;
  --gold-bg:rgba(162,102,15,.10); --gold-line:rgba(162,102,15,.34);
  --good-bg:rgba(26,158,117,.10); --good-line:rgba(26,158,117,.32);
  --scrim:rgba(28,34,62,.42);
  --acc-soft:rgba(10,190,197,.14);   /* 「選中的那一列」的淡青底（取代沒定義的 --accent-soft） */
  --theme-color:#4b5082;             
  
   --map-node:#ffffff; --map-node-line:#8d9abb; --map-text:#5a6689;
  --map-city:#0cb4c0; --map-village:#147f5d; --map-entry:#a2660f; --map-wild:#8d9abb;
  --map-tower:#8b6ad0; --map-here:#b9791a; --map-can:#0cb4c0; --map-danger:#d24f4a;

  /* ── 尺度（手機優先：這裡是 390 寬的預設；桌機在下面的 @media 往回收） ── */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:22px; --sp6:30px;
     --rad-pill:999px;   /* 方形、小圓角 */
  --fs-xs:12px; --fs-s:13px; --fs-m:15px; --fs-l:16px; --fs-xl:18px; --fs-2xl:22px; --fs-3xl:36px;
  --tap:44px; --tap-s:44px;            /* 點擊區：手機一律 ≥44px */
  --dock-h:68px;                       /* 底部固定操作列的高度（body 要讓出這麼多） */
  --lh:1.6; --lh-tight:1.3;
  --e1:var(--sh1); --e2:var(--sh2);
                         /* 過渡：溫和，不彈跳 */
  --tr-press:.14s ease-out;            /* 按下／放開：要快（100ms 內看得到回饋） */
  --ring:0 0 0 3px rgba(12,180,192,.28);
  --glow:0 0 .33333rem var(--acc);     /* hover／focus 的青色光暈 */
  /* 兼容旧别名 */
  --fg:var(--tx); --dim:var(--tx3); --dim2:var(--tx2); --panel:var(--surface); --panel2:var(--surface2);
}
@media(min-width:980px){
  :root{ --fs-xs:11.5px; --fs-s:12.5px; --fs-m:13.5px; --fs-l:15px; --fs-xl:17px; --fs-2xl:21px; --fs-3xl:34px;
    --tap:34px; --tap-s:28px; --dock-h:0px; }
}
html[data-theme="dark"]{
  /* 夜靛藍（2026-10-08 設計者拍板：深色主題取代近黑，維持兩個主題）。
     底色系取自 ref-04 ファンキット 的實測取樣：#32386e（滿版靛藍）／青 #0ebdc3／白 #f8f8f4；
     深淺三階是為 UI 層次另排的（ref-04 是單片底，沒有卡面）。
     對比已算（WCAG）：tx/surface 9.95、tx2 7.35、tx3 4.62（最亮的 surface3）、acc 5.30 —— 全部 ≥ AA 4.5。 */
  color-scheme:dark;
  --theme-color:#252b60;
  --acc-soft:rgba(25,200,207,.16);
   --bg-star:rgba(206,214,246,.4);
    
   
    
  --acc:#19c8cf; --acc-h:#3ad6db; --acc-d:#5fdde2; --acc-l:#a8f4f8; --acc-ink:#03343a;
  --ig:#9aa1e0; --lav:#bdaef2; --star:#ffde6d; --good:#4fe0b8; --bad:#ff8a80; --warn:#ffc46b; --pur:#c4a6f5;
  --bar-grad:linear-gradient(180deg,rgba(50,56,110,.96),rgba(40,46,96,.9)); --bar-tx:#f2f4ff;
  --bar-line:rgba(120,130,200,.35);
  
  --tint:rgba(150,160,230,.16); --tint-line:rgba(150,160,230,.32); --tint-hover:rgba(150,160,230,.22);
  --hair:1px dashed rgba(170,178,222,.28);
  --input-bg:#272c62; --input-line:#4d5499;
  --row-hover:rgba(25,200,207,.1);
  --bad-bg:rgba(255,138,128,.16); --bad-line:rgba(255,138,128,.5); --bad-tx:#ffd9d5;
  --hold-bg:rgba(255,196,107,.15); --hold-line:rgba(255,196,107,.5); --hold-tx:#ffd9a6;
  --gold-bg:rgba(255,222,109,.14); --gold-line:rgba(255,222,109,.34);
  --good-bg:rgba(79,224,184,.14); --good-line:rgba(79,224,184,.32);
  --scrim:rgba(13,17,48,.74);
  --sh1:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 8px rgba(10,13,38,.35);
  --sh2:0 1px 0 rgba(255,255,255,.07) inset, 0 14px 34px rgba(8,11,32,.5);
  --ring:0 0 0 3px rgba(25,200,207,.28);
   --map-node:#32386e; --map-node-line:#767ec4; --map-text:#ccd3f2;
  --map-city:#19c8cf; --map-village:#4fe0b8; --map-entry:#ffde6d; --map-wild:#929ad0;
  --map-tower:#c4a6f5; --map-here:#ffde6d; --map-can:#19c8cf; --map-danger:#ff8a80;
  /* 原生捲軸也跟著靛藍（否則右緣會是一條瀏覽器預設灰黑，跟底色不搭）；寬度不受影響 */
  scrollbar-color:#4d5499 #232a5e;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0 auto;max-width:1180px;padding:0 var(--sp3) calc(var(--dock-h) + var(--sp5));color:var(--tx);
  font:var(--fs-m)/var(--lh) -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Noto Sans CJK JP",
    "Hiragino Sans","Yu Gothic UI","Microsoft YaHei",system-ui,sans-serif;
  letter-spacing:.005em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  
  
}
/* 三語字型分流：html 的 lang 由 applyLang 設（zh-Hans／zh-Hant／ja）。zh-Hans 維持上面 body 那串（簡中字形優先）；
   日文與繁中各自把自己的字形排在前面，免得落到簡中字形。word-break:auto-phrase＝漸進增強（不支援的瀏覽器退回原本的斷法）：
   只套在「整段文字」的區塊（日誌句子／景文／CTA 句／玩法說明）；**不能套在 flex 列裡的按鈕與標籤**——它只准在詞組邊界斷行，
   按鈕縮不下去就把整列撐寬（320 寬日文的日誌頁籤實測會橫向溢出） */
html:lang(ja) body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",
  Meiryo,"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
html:lang(zh-Hant) body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",
  system-ui,sans-serif}
:lang(ja) :is(.ev .ebd,.ev .sayt,.ev .enote,#cta .scenetx,#cta .ctatx,.mbody),
:lang(zh-Hant) :is(.ev .ebd,.ev .sayt,.ev .enote,#cta .scenetx,#cta .ctatx,.mbody),
:lang(zh-Hans) :is(.ev .ebd,.ev .sayt,.ev .enote,#cta .scenetx,#cta .ctatx,.mbody){word-break:auto-phrase}
html:lang(ja){--lh:1.75;--fs-xs:13px}               /* 假名密、筆畫多：行高放寬、最小字提到 13px */
@media(min-width:980px){ html:lang(ja){--fs-xs:12px} }
h1,h2,h3{line-height:var(--lh-tight);letter-spacing:.01em}
hr{border:0;border-top:var(--hair);margin:var(--sp3) 0}
a{color:var(--acc)}
.spacer{flex:1}
.sub{font-size:var(--fs-s);color:var(--tx3);margin:var(--sp2) 0 0}

/* ── 顶栏（深靛蓝，像游戏页头） ── */
/* 手機：一行到底（標題單行省略、語言用下拉、玩法說明只剩圖示）；桌機才展開成文字按鈕與三語分段鈕 */
.bar{top:0;z-index:20;display:flex;align-items:center;
  flex-wrap:nowrap;row-gap:var(--sp1);
  margin:0 calc(var(--sp3) * -1) 0;padding:var(--sp1) var(--sp3);
  
  backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:var(--sp2);min-width:0;flex:1 1 auto}

.brand span{font-size:var(--fs-xl);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar #sub.info{display:none}
.pill{height:24px;display:inline-flex;align-items:center;padding:0 var(--sp3);font-size:var(--fs-s);
  flex:0 0 auto;white-space:nowrap;
  border-radius:var(--rad-pill);border:1px solid var(--tint-line);background:var(--tint);color:var(--tx2);font-weight:650}

.pill.on{color:var(--acc-ink);background:var(--acc-l);border-color:transparent;
  box-shadow:0 4px 14px rgba(12,180,192,.35)}
.langs{gap:var(--sp1);display:flex;
  flex:0 0 auto;white-space:nowrap}
.langs button{height:auto;min-height:22px;padding:0 var(--sp2);font-size:var(--fs-xs);
  border:0;background:transparent;color:var(--bar-tx);font-weight:700;opacity:.75;white-space:nowrap}
.langs button[aria-pressed="true"]{opacity:1}
.langs select{height:var(--tap);border-radius:var(--rad-pill);border:0;background:transparent;color:var(--bar-tx);
  font-weight:750;font-size:var(--fs-m);padding:0 var(--sp2)}
.langs select option{color:var(--tx);background:var(--surface)}
.langs button{display:none}

.qbtn{height:auto;min-height:var(--tap);min-width:var(--tap);padding:0;font-size:var(--fs-s);border-radius:var(--rad-s);
  flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp1);
  background:var(--tint);border:1px solid var(--tint-line);color:var(--bar-tx);font-weight:650}
.qbtn .qtx{display:none;white-space:nowrap}
.qbtn .ic{width:18px;height:18px}
@media(hover:hover){.qbtn:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}}
.qbtn.acct{border-color:var(--acc)}   /* 已登入＝帳號資訊鈕（頂欄那顆顯示帳號名） */
.tbtn{width:var(--tap);height:auto;min-height:var(--tap);padding:0;flex:0 0 auto;border-radius:var(--rad-s);border:1px solid var(--tint-line);
  background:var(--tint);color:var(--bar-tx);display:inline-flex;align-items:center;justify-content:center}
@media(hover:hover){.tbtn:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}}
.tbtn .ic{width:16px;height:16px}
#stagePill{display:none}
#sub.info{display:none}
/* 即時翻譯開關：跟語言切換同一區。開＝青綠實心（跟語言分段鈕的「選中」同一套），關＝淡、圖示上一道斜線 */
.trbtn{position:relative;height:auto;min-height:var(--tap);min-width:var(--tap);padding:0;flex:0 0 auto;border-radius:var(--rad-s);white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp1);font-size:var(--fs-s);
  background:var(--tint);border:1px solid var(--tint-line);color:var(--bar-tx);opacity:.7}
.trbtn .qtx{display:none}
.trbtn .ic{width:18px;height:18px}
.trbtn::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:2px;margin:-1px 0 0 -11px;border-radius:var(--rad-pill);
  background:currentColor;transform:rotate(-45deg)}
.trbtn[aria-pressed="true"]{background:var(--surface);border-color:transparent;color:var(--acc-d);opacity:1}
.trbtn[aria-pressed="true"]::after{display:none}
/* 譯文：直接取代原文；前面一枚極小的標記說「這是譯文／原文」，點那則文字就切換。
   .pend＝還在翻（標記淡淡的、先佔好位，回來時文字就地換掉不推版面）；失敗／同語＝沒有標記，照原文 */
.tx.ok{cursor:pointer;border-radius:var(--rad-s);transition:background var(--tr)}
@media(hover:hover){.tx.ok:hover{background:var(--row-hover)}}
.tx.ok:focus-visible{outline:none;box-shadow:var(--ring)}
.txm{position:relative;display:inline-block;margin-right:var(--sp1);padding:0 var(--sp1);border-radius:var(--rad-s);
  font-size:var(--fs-xs);font-weight:700;line-height:1.35;letter-spacing:0;font-style:normal;white-space:nowrap;vertical-align:1px;
  color:var(--acc-d);background:var(--surface);border:1px solid var(--tint-line)}
.txm:empty{display:none}
.tx.orig .txm{color:var(--tx3);border-style:dashed}
.tx.pend .txm{opacity:.38;animation:busy 1.4s ease-in-out infinite}
#scenetx .tx.ok{cursor:inherit}
@media(hover:hover){#scenetx .tx.ok:hover{background:none}}
#scenetx .txm{cursor:pointer}
#scenetx .txm::after{content:"";position:absolute;inset:-12px -10px}   /* 景文裡只有標記能切（點文字＝展開／收合）：把可點範圍撐到手指大小 */
@media(min-width:980px){
  .trbtn{height:auto;min-height:26px;min-width:0;padding:0 var(--sp3)}
  .trbtn .qtx{display:inline}
  .trbtn .ic{width:15px;height:15px}
  .trbtn::after{left:calc(var(--sp3) + 7.5px);width:20px;margin-left:-10px}
}
@media(min-width:980px){
  
  
  .langs button{display:inline-block}
  .langs select{display:none}
  .qbtn{height:auto;min-height:26px;padding:0 var(--sp3)}
  /* 寬螢幕＝圖示＋id 橫向排列；名字太長只省略，**不換行**（窄螢幕維持只顯示圖示） */
  .qbtn .qtx{display:inline-block;max-width:11em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .qbtn .ic{width:15px;height:15px}
  .tbtn{width:30px;height:auto;min-height:30px}
  
  
  
}

/* ── 版面：手機（<980）＝三欄攤平成單欄，順序＝席位 → 我的狀態 → 現在該做 → 入座/指令區 → 日誌 → 發言 → 位置 → 秘密；
      「現在想做什麼？」＋發言固定在螢幕底部（#dock）。桌機（≥980）＝左欄（狀態／席位／✉）中欄（這一景／日誌／發言）右欄（地圖／位置／秘密／行動）。 ── */
.wrap{display:flex;flex-direction:column;gap:var(--sp3);margin-top:var(--sp3)}
.colL,.colC,.colR{display:contents}
@media(max-width:979px){
  /* 頂欄整理（owner 2026-10-19：「回到大廳疊在地圖按鈕後面」）：
     手機只保留 地圖／帳號／設定 三顆；玩法說明與大廳搬進「設定」抽屜。
     地圖鈕由 JS 搬進 .bar（見 placeMapFab），所以不會再壓在別的按鈕上。 */
  .bar #howtobtn,.bar #lobbyhome{display:none!important}
  .bar #mapfab_tx{display:none!important}
  .pref-extra{display:flex;gap:6px;flex-wrap:wrap}
}
@media(min-width:980px){.pref-extra{display:none}}
@media(max-width:979px){
  #actionbox,#entrycard{order:3}#storycard{order:4}#saybar{order:5}
  #boardbox{order:6}#mybox{order:7}#gmpanel{order:9}   /* 席位排最前（左上） */
}
#storycard{max-height:72vh;max-height:72dvh}
body.pregame #storycard{height:auto;max-height:48vh;max-height:48dvh;min-height:0}

/* ── 卡片 ── */
.card{position:relative;padding:var(--sp4);
  
  transition:border-color var(--tr),box-shadow var(--tr)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:var(--rad-l) var(--rad-l) 0 0;
  background:linear-gradient(90deg,var(--acc),transparent 65%);opacity:.55}

.card{scroll-margin-top:calc(var(--tap) + var(--sp5))}
.argbox,.res{scroll-margin-bottom:calc(var(--dock-h) + var(--sp4))}
.card>.hd{display:flex;align-items:center;gap:var(--sp2);
  }

.card.priv{border-color:var(--gold-line)}
.card.priv::before{background:linear-gradient(90deg,var(--star),transparent 70%)}
.card.quiet::before{opacity:.25}

/* ── 按钮 ── */
/* 按鈕：方形小圓角、飽和色底；hover／focus＝底色轉青綠＋青色光暈；過渡 .3s ease。
   按下＝scale(.97)＋亮度略降（--tr-press，放開回彈）；.busy＝進行中（不可連按）；.rej＝被拒（紅框＋輕搖）；.ok＝成功綠閃 */
button{height:auto;min-height:var(--tap);padding:0 var(--sp4);border-radius:var(--rad-s);font-size:var(--fs-m);
  font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--tx);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background var(--tr),border-color var(--tr),color var(--tr),box-shadow var(--tr),
    transform var(--tr-press),filter var(--tr-press)}
/* hover 只給「真的有 hover 的指標」（滑鼠）；觸控點一下不再讓按鈕卡在青底（:active 的縮放回饋照舊） */
@media(hover:hover){
button:not(.cell):hover{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}
.cell:hover{border-color:var(--acc);box-shadow:var(--glow)}   /* 狀態格：資訊用，hover 只亮邊框，不換底色 */
}
button:active{filter:brightness(.9);transition:transform 0s,filter 0s}   /* 按下立刻縮（不等過渡）；放開時照 --tr-press 回彈 */
button:focus-visible{outline:none;box-shadow:var(--ring),var(--glow)}
button:disabled{cursor:default;opacity:.55}
button.pri,button.btn-p,button.primary{background:var(--ig);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(75,80,130,.28)}   /* .btn-p＝私訊送出、.primary＝登入送出：跟 .pri 同一張臉 */
button.ghost{border:1px solid var(--line2);}
@media(hover:hover){
button:disabled:hover{background:var(--surface2);border-color:var(--line);color:var(--tx);box-shadow:none}
button.pri:hover,button.btn-p:hover,button.primary:hover{background:var(--acc-h);color:var(--acc-ink);box-shadow:var(--glow)}
button.ghost:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}
}
button.busy{position:relative;pointer-events:none;cursor:progress;filter:none;transform:none;
  border-color:var(--acc);background:var(--row-hover);color:var(--acc-d);animation:busy 1s ease-in-out infinite}
@keyframes busy{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:var(--glow)}}
button.rej{border-color:var(--bad) !important;box-shadow:0 0 0 2px var(--bad-line) !important;animation:shake .36s ease-in-out 1}
button.ok{animation:okflash .7s ease 1}
@keyframes okflash{0%{background:var(--good-bg);border-color:var(--good);box-shadow:0 0 0 3px var(--good-line)}100%{}}
button.sm{height:auto;min-height:var(--tap-s);min-width:var(--tap-s);padding:0 var(--sp3);font-size:var(--fs-s);}
.row{display:flex;flex-wrap:wrap;gap:var(--sp2);margin:var(--sp2) 0}
.row.grow>*{flex:1 1 auto;min-width:0}

/* ── 输入 ── */
input,select,textarea{height:var(--tap);padding:0 var(--sp3);background:var(--input-bg);
  border:1px solid var(--input-line);color:var(--tx);font-size:var(--fs-m);font-family:inherit;
  transition:border-color var(--tr),box-shadow var(--tr)}
textarea{height:auto;padding:var(--sp2) var(--sp3);line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select{padding-right:var(--sp2)}

/* ── 标签 / 徽章 / 文本 ── */
.k{display:inline-flex;align-items:center;font-size:var(--fs-xs);
  background:var(--tint);color:var(--tx2);border:1px solid transparent;}
.k.gold{background:var(--gold-bg);color:var(--star);}
.k.good{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.k.pur{background:rgba(139,106,208,.12);color:var(--pur);border-color:rgba(139,106,208,.3)}
.chip{display:inline-flex;align-items:center;gap:var(--sp1);padding:var(--sp1) var(--sp3);font-size:var(--fs-s);
  background:var(--tint);border:1px solid var(--tint-line);color:var(--tx2)}
.chip.p{background:var(--gold-bg);border-color:var(--gold-line);color:var(--star)}
.chip.on{background:var(--acc-l);border-color:transparent;color:var(--acc-ink);font-weight:700}   /* 選中（私訊對象）：跟 .pill.on 同一套 */
.hint{font-size:var(--fs-s);color:var(--tx3);line-height:1.55}
.dim{color:var(--tx3)}

/* ── 进度条 ── */
.bar2{height:6px;border-radius:var(--rad-pill);background:var(--tint);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:var(--rad-pill);background:linear-gradient(90deg,var(--acc),var(--acc-l))}
.bar2.hp i{background:linear-gradient(90deg,#1a9e75,#6fd6b4)}
.bar2.hp.low i{background:linear-gradient(90deg,#d24f4a,#f0918c)}
.bar2.mem i{background:linear-gradient(90deg,#606597,#9392ca)}
.bar2.mem.low i{background:linear-gradient(90deg,#d24f4a,#f0918c)}
.bar2.quota i{background:linear-gradient(90deg,#8b6ad0,#c0a8f0)}

/* ── 角色状态栏 / 席位 ── */
.cbar{display:flex;flex-wrap:wrap;
  }
.cbar.me{border-color:var(--acc);}
.cbar.npc{border-style:dashed}
.cbar .cn{font-weight:750}
.cbar .kv2{margin-left:auto;display:flex;align-items:center;gap:var(--sp2);font-size:var(--fs-s)}
.seat{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) 0;border-bottom:var(--hair);font-size:var(--fs-m)}
.seat:last-child{border-bottom:0}
.seat .nm{font-weight:700}
.seat.me{color:var(--acc-d)}

/* ── 「现在该做」：进场第一眼的一句话 ── */

/* ★觀戰桌（watch_server.py）：唯讀態——藏掉所有互動區，只留桌況／地圖／公開日誌 */
body[data-watch] #cta, body[data-watch] #saybar, body[data-watch] #entrycard,
body[data-watch] #actionbox, body[data-watch] #actbtn, body[data-watch] #authopen,
body[data-watch] #momobtn{display:none !important}
#watchbar{display:none;align-items:center;gap:.5rem;margin:.35rem 0}
body[data-watch] #watchbar{display:flex}
#cta.go{border-color:var(--acc);}
#cta.go::before{opacity:1;}
#cta .ctamain{display:flex;align-items:center;gap:var(--sp3);flex-wrap:wrap}
#cta .hd{flex-wrap:wrap}
#cta .hd .t,#cta .hd .k{white-space:nowrap}
#cta .hd #rhybtn{margin-left:auto;white-space:nowrap}
#cta .ctatx{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
#cta .ctasub{margin-top:var(--sp2)}
.gmready{margin:var(--sp2) 0;padding:var(--sp2) var(--sp3);border-radius:var(--rad-m);background:var(--tint);border:1px solid var(--tint-line)}
#cta .scenetx{margin-top:var(--sp3);
  font-size:var(--fs-m);overflow-wrap:anywhere;
  -webkit-box-orient:vertical;cursor:pointer}
#cta .scenetx.open{display:block;-webkit-line-clamp:unset}
.rhythm{margin-top:var(--sp3);border-radius:var(--rad-m);
  font-size:var(--fs-s);line-height:1.75;color:var(--tx)}
.rhythm p{margin:0 0 var(--sp1)}
.rhythm .row{margin:var(--sp2) 0 0}
.qchip{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp2);font-size:var(--fs-xs);
  font-weight:700;background:var(--tint);color:var(--tx2);border:1px solid var(--tint-line);white-space:nowrap}
.pulse{animation:pulse 1.1s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 14px transparent}}

/* ── 指令區「現在想做什麼？」（借 ACFUN 大逃殺：問句標題、一顆按鈕＝一個行動、只列此刻能做的事）──
      狀態機：不能動（景已收／輪到別人／額度用完）→ 一句原因；可以動 → 行動磚；點了某個行動 → 參數就是按鈕，按了就送出 */
#actionbox>.hd{margin-bottom:var(--sp2)}
#actquota{transform-origin:right center}
.cmdq{font-size:var(--fs-l) !important;letter-spacing:.02em !important;text-transform:none !important;color:var(--ig) !important;font-weight:800 !important}
html[data-theme="dark"] .cmdq{color:var(--tx) !important}
.cmdq .ic{width:18px;height:18px}
/* 行動磚：手機四欄、每格 ≥52px 高（大拇指點得到） */
.arow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));}
.arow button{line-height:var(--lh-tight);
  display:flex;align-items:center;justify-content:center;text-align:center;
  white-space:normal;overflow-wrap:anywhere;}
html[data-theme="dark"] .arow button{color:var(--tx)}

@media(hover:hover){.arow button:hover .ic{color:var(--acc-ink)}}
.arow button.more{color:var(--tx2);}
.arow+.arow{margin-top:var(--sp2)}
.cmdmsg{display:flex;align-items:center;gap:var(--sp2);min-height:var(--tap);padding:var(--sp2) var(--sp3);
  background:var(--surface2);border:1px solid var(--line);font-size:var(--fs-m);font-weight:650;color:var(--tx2);line-height:1.5}
.cmdmsg .ic{width:20px;height:20px;color:var(--tx3)}
.cmdmsg.out{background:var(--gold-bg);border-color:var(--gold-line);color:var(--tx)}
.cmdmsg.out .ic{color:var(--star)}
.offs{margin-top:var(--sp2);font-size:var(--fs-s);color:var(--tx3)}
.offs .offhd{font-weight:700;color:var(--tx2);margin-bottom:2px}
.offs .offrow{display:flex;gap:var(--sp2);padding:3px 0;border-bottom:var(--hair)}
.offs .offrow b{flex:0 0 auto;color:var(--tx2)}
details.offs summary{cursor:pointer;font-weight:650;color:var(--tx2);min-height:var(--tap-s);display:flex;align-items:center}
/* 參數面板：返回＋標題＋一句說明＋「選項＝按鈕」 */
.argbox{border-radius:var(--rad-m);}
.argbox .arghd{display:flex;align-items:center;gap:var(--sp2)}
.argbox .arghd .back{flex:0 0 auto;min-width:var(--tap);padding:0 var(--sp3)}
.argbox .argtitle{font-weight:800;font-size:var(--fs-l);display:flex;align-items:center;gap:var(--sp2);min-width:0}
html[data-theme="dark"] .argbox .argtitle{color:var(--tx)}
.argbox .argdesc{font-size:var(--fs-s);color:var(--tx2);line-height:1.55}
.argbox .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp2)}
.argbox .opts .why{grid-column:1/-1}
.argbox .opt{height:auto;padding:var(--sp2) var(--sp3);display:flex;align-items:center;gap:var(--sp2);text-align:left;
  white-space:normal;overflow-wrap:anywhere;line-height:var(--lh-tight);font-weight:750}
.argbox .opt small{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--tx3);margin-top:2px}
@media(hover:hover){.argbox .opt:hover small{color:var(--acc-ink)}}

.argbox .opt.go{grid-column:1/-1;justify-content:center;text-align:center;}
@media(hover:hover){.argbox .opt.go:hover{background:var(--acc-h);color:var(--acc-ink)}}
.argbox .opt.warn small{color:var(--bad)}
.argbox .sublbl{margin:var(--sp2) 0 var(--sp1);font-size:var(--fs-xs);font-weight:750;}
.argbox input{width:100%;max-width:100%}
.argbox .dcrow{display:flex;align-items:center;gap:var(--sp2);margin-bottom:var(--sp2)}
.argbox .dcrow input{flex:1 1 auto;min-width:0}
.argbox details summary{cursor:pointer;font-size:var(--fs-s);color:var(--acc-d);font-weight:650;margin-top:var(--sp2);
  min-height:var(--tap-s);display:flex;align-items:center}
.argbox details input{margin-top:var(--sp1)}
.why{display:flex;align-items:flex-start;gap:var(--sp1);font-size:var(--fs-s);font-weight:650;color:var(--bad-tx);line-height:1.5;
  padding:var(--sp1) var(--sp2);border-radius:var(--rad-s);background:var(--bad-bg);border:1px solid var(--bad-line);animation:pop .25s ease 1}
.why .ic{margin-top:2px}
#actionbox.flash{animation:okcard .8s ease 1}
@keyframes okcard{0%{border-color:var(--good);box-shadow:0 0 0 3px var(--good-line)}100%{}}
.fmsg{margin-top:var(--sp2);font-size:var(--fs-s);color:var(--bad-tx)}
.res{margin:0 0 var(--sp2);padding:var(--sp2) var(--sp3);background:var(--good-bg);border:1px solid var(--good-line);
  max-height:30vh;max-height:30dvh;overflow:auto;animation:pop .3s ease 1}
.res.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-tx);animation:shake .36s ease-in-out 1}
.res .reshd{display:flex;align-items:center;gap:var(--sp2);font-weight:750}
.res .reshd>span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.res .reshd .x{flex:0 0 auto;margin-left:auto;height:auto;min-height:var(--tap-s);min-width:var(--tap-s);padding:0 var(--sp2);border-radius:var(--rad-s);font-size:var(--fs-xs)}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.res ul{margin:var(--sp2) 0 0;padding:0;list-style:none;font-size:var(--fs-m);line-height:1.7}
.res li{padding:2px 0;overflow-wrap:anywhere}
.res .qline{margin-top:var(--sp2)}
.fld{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-xs);color:var(--tx3)}
.fld input{width:64px}
.cbar{flex-direction:column;align-items:stretch;}
.cbar .cb1,.cbar .cb2{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp2)}
.cbar .cb2{font-size:var(--fs-s);color:var(--tx3)}
.cbar .cb2 .la{color:var(--tx2);overflow-wrap:anywhere;min-width:0}
.feats{display:flex;flex-wrap:wrap;gap:var(--sp1);margin:var(--sp2) 0}

/* ── 桌上日志：谁做了什么、结果如何 ── */
.stream{overflow:auto;padding-right:var(--sp1)}
#storycard{display:flex;flex-direction:column}
#storycard .stream{flex:1 1 auto;min-height:0}
.ev{display:flex;gap:var(--sp2);border-left:3px solid var(--line2);}
@media(hover:hover){.ev:hover{background:var(--row-hover)}}
.ev .eico{flex:0 0 auto;margin-top:3px;color:var(--tx3)}
.ev .ebd{flex:1 1 auto;min-width:0;font-size:var(--fs-m);line-height:1.6;overflow-wrap:anywhere}
.ev .who{font-weight:750;margin-right:var(--sp1)}
.ev .enote{margin-top:2px;font-size:var(--fs-s);color:var(--tx3);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .enote:hover{-webkit-line-clamp:unset}
.ev .sayt{border-radius:var(--rad-m);
  line-height:1.7;white-space:pre-wrap}
.ev.a-me{border-left-color:var(--acc)}
.ev.a-me .who{color:var(--acc-d)}

.ev.a-gm{border-left-color:var(--star)}.ev.a-gm .who{color:var(--star)}
.ev.a-gm .sayt{background:var(--gold-bg);}
.ev.a-npc{border-left-color:var(--tx3)}.ev.a-npc .who{color:var(--tx2)}
.ev.sys{border-left-color:transparent;padding-top:2px;padding-bottom:2px}
.ev.sys .ebd{font-size:var(--fs-s);color:var(--tx3)}
.ev.sys .who{color:var(--tx2)}
.ev.big{background:var(--gold-bg);border-left-color:var(--star)}
.ev.scn{display:block;}
.ev.scn .ebd{font-weight:700}
.ev.scn .enote{font-weight:400;-webkit-line-clamp:unset}
.ev.unk .ebd{color:var(--tx3);font-size:var(--fs-s)}
.logmore{display:flex;margin:0 auto var(--sp2)}
.sayfb{font-size:var(--fs-s);margin-top:var(--sp1);color:var(--good)}
.sayfb.bad{color:var(--bad-tx)}

/* ── 地图浮窗 ── */
.mapfloat{position:fixed;right:var(--sp4);bottom:64px;z-index:61;width:min(452px,94vw);max-height:60vh;max-height:60dvh;
  display:flex;flex-direction:column;border-radius:var(--rad-l);box-shadow:var(--sh2)}
.mapfloat>.hd{display:flex;align-items:center;gap:var(--sp2);margin-bottom:var(--sp2);
  padding-bottom:var(--sp2);border-bottom:var(--hair)}
.mapfloat>.hd .t{white-space:nowrap}
.mapfloat>.hd button{white-space:nowrap}
.mapfloat.dragging>.hd{cursor:grabbing}
.mapfloat .svgwrap{flex:1 1 auto;min-height:130px;max-height:34vh;max-height:34dvh;margin:2px 0 var(--sp2);overflow:auto;
  touch-action:pan-x pan-y;cursor:grab;background:var(--surface2);border-radius:var(--rad-m);
  border:1px solid var(--line)}
.mapfloat .svgwrap.panning{cursor:grabbing}
#mapsvg{display:block}
/* 沒座標的棋盤：文字版地圖（同一個浮窗、同一套「點一下＝選好去哪」） */
.maplist{flex:1 1 auto;min-height:120px;max-height:34vh;max-height:34dvh;overflow:auto;margin:2px 0 var(--sp2);
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--rad-m);padding:var(--sp1)}
.maplist .mrow{display:flex;align-items:baseline;gap:var(--sp2);padding:3px var(--sp2);border-radius:var(--rad-s);
  border:1px solid transparent;font-size:var(--fs-s)}
.maplist .mrow .mn{flex:0 0 auto;font-weight:600;color:var(--tx)}
.maplist .mrow .mt{flex:1 1 auto;color:var(--tx3);font-size:var(--fs-xs)}
.maplist .mrow .mk{flex:0 0 auto;font-size:var(--fs-xs)}
.maplist .mrow.can{cursor:pointer;border-color:var(--map-can);background:var(--surface)}
.maplist .mrow.can .mk{color:var(--map-can)}
.maplist .mrow.here{border-color:var(--map-here);background:var(--surface)}
.maplist .mrow.here .mn,.maplist .mrow.here .mk{color:var(--map-here);font-weight:700}
.lgd{display:flex;flex-wrap:wrap;gap:var(--sp2);margin-top:var(--sp2);font-size:var(--fs-s);color:var(--tx3)}
.lgd span{display:inline-flex;align-items:center;gap:4px}
.lgd i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fab{position:fixed;right:var(--sp4);bottom:var(--sp4);z-index:60;height:auto;min-height:40px;display:inline-flex;align-items:center;
  gap:var(--sp2);padding:0 var(--sp4);border-radius:var(--rad-m);border:0;font-weight:750;
  background:var(--ig);color:#fff;
  box-shadow:0 10px 26px rgba(12,180,192,.34)}
@media(hover:hover){.fab:hover{filter:brightness(1.04)}}
.fab .ic{width:17px;height:17px}

/* ── 玩法弹窗 ── */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  padding:var(--sp4);}
.modal.on{display:flex}
.modalpanel{width:100%;max-width:780px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--surface);
  overflow:hidden}
.mhd{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp4) var(--sp5);
  }
.mhd b{font-size:var(--fs-xl);letter-spacing:.02em}
.mhd button{margin-left:auto;}
@media(hover:hover){.mhd button:hover{background:rgba(255,255,255,.22);color:#fff}}
.mbody{overflow:auto;padding:var(--sp4) var(--sp5);font-size:var(--fs-m);line-height:1.85;color:var(--tx2)}
.mbody b{color:var(--tx)}
.mft{padding:var(--sp3) var(--sp5);border-top:var(--hair);display:flex;justify-content:flex-end}

/* ── 错误横幅 ── */
.errbar{margin:var(--sp2) 0 0;padding:var(--sp2) var(--sp3);border-radius:var(--rad-m);font-size:var(--fs-s);
  line-height:1.6;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-tx)}

/* 狀態通知（暫停／結束）住在「現在想做什麼？」卡裡：緊湊、一行一條、不搶按鈕的位置。 */

/* ── 整桌暫停橫幅（2026-10-06 設計者：「對局暫停時，畫面上要有表示」）──
   牌面凍結、時間停在暫停那一刻；說話照常 ⇒ 用「警示」色而非「錯誤」色：這是狀態，不是錯誤。 */
.holdbar{margin:0 0 var(--sp1);padding:var(--sp1) var(--sp2);font-size:var(--fs-s);
  line-height:1.5;background:var(--hold-bg);border:1px solid var(--hold-line);color:var(--hold-tx);
  display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.holdbar .holdnote{font-size:var(--fs-s);opacity:.85}

/* ── 本局結束橫幅（2026-10-07 設計者：「局收尾了為什麼還在倒數」）──
   判了結局 ⇒ 桌子把時間軸停住（不再倒數／換手／叫醒）；畫面上必須看得出來，
   否則玩家只會看到一個不會動的倒數。跟暫停同一組色：是狀態，不是錯誤。 */
.endbar{margin:0 0 var(--sp1);padding:var(--sp1) var(--sp2);font-size:var(--fs-s);
  line-height:1.5;background:var(--hold-bg);border:1px solid var(--hold-line);color:var(--hold-tx);
  display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.endbar .endnote{font-size:var(--fs-s);opacity:.85}
.logtabs{margin-left:.4rem}
button.sm.on,.logtabs button.on{background:var(--acc-l);border-color:transparent;color:var(--acc-ink);font-weight:700}   /* 選中：跟 .pill.on／.chip.on 同一套 */
.lgd .lgdchip{margin-right:.35rem}
#sumcard{display:flex;flex-direction:column}
.sumwrap{padding:.4rem .6rem .7rem}
.sumhd{margin:.5rem 0 .25rem;opacity:.9}
.sumln{margin:.15rem 0;font-size:var(--fs-s)}
.sumtb{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.sumtb th,.sumtb td{padding:.28rem .4rem;text-align:left;border-bottom:1px solid var(--line)}
.sumtb tr.mine{background:var(--acc-soft)}
.endbar .endname{font-weight:600}
.endbar .endseats{font-size:var(--fs-s);opacity:.92}

/* 本回合剩餘時間（2026-10-06 設計者：「暫停時倒計時也凍住」）：等寬數字免得每秒跳動時版面抖；
   暫停中整片變成 hold 色 ⇒ 一眼看得出它是「停住的」。 */
/* ── HUD 的橫棒（有上下限的數值：HP／記憶／魔力／經驗）──
   一格一條、滿寬；`low`（<25%）轉警示色；點它會出跟小格子同一套說明。 */
.hudbars{display:flex;gap:var(--sp2);align-items:flex-start;width:100%;margin:0 0 var(--sp2)}
.hudbars .hudbar{flex:1 1 0;min-width:0}   /* 四條棒**保證**同一行、等寬（窄螢幕也只縮不換行） */
.hudbar{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"lab" "bar" "num";
  row-gap:1px;align-items:start;align-content:start;width:100%;background:transparent;border:0;padding:0;
  font:inherit;color:inherit;cursor:pointer;text-align:left}
.hudbar .bl{grid-area:lab;justify-self:start;display:inline-flex;align-items:center;gap:.25rem;
  font-size:var(--fs-xs);opacity:.85;white-space:nowrap;height:1.25em}   /* 固定行高 ⇒ 四條棒的上緣對齊 */
.hudbar .bt{grid-area:bar;width:100%;height:9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);overflow:hidden}
.hudbar .bt i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .25s ease}
.hudbar.bar-hp .bt i{background:var(--acc)}
.hudbar.bar-mem .bt i{background:var(--map-tower)}
.hudbar.bar-mana .bt i{background:var(--good)}
.hudbar.bar-lvl .bt i{background:var(--star)}
/* ⚠ 棒的 class **不能叫 res/hp/mem/lvl**：本檔有全域 `.res`（有 padding／背景／動畫）⇒ 會把棒的內容擠到被裁掉
   （設計者 2026-10-07 抓到的「魔力數字下緣被截斷」就是 `hudbar res` 撞到 `.res`）。前綴 `bar-` 一次解掉。 */
.hudbar.low .bt i{background:var(--bad)}
.hudbar b{grid-area:num;justify-self:end;font-size:var(--fs-xs);font-variant-numeric:tabular-nums;line-height:1.2}
.hudbar.on .bt{box-shadow:var(--ring)}
.turnpill{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
.turnpill.held{background:var(--hold-bg);border-color:var(--hold-line);color:var(--hold-tx)}

/* ── 图标 ── */
.ic{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-2.5px}
.ic.lg{width:18px;height:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px var(--sp3);font-size:var(--fs-m);margin:var(--sp2) 0}
.kv dt{color:var(--tx3)}
.kv dd{margin:0}
h1,h2,h3{color:var(--tx)}

.card>.hd .t .ic{color:var(--acc-d)}

/* ── 我的狀態（HUD）：一眼看懂「我還能做幾次、我還剩多少、身上有什麼」 ──
      只畫 view 給的數字（you.* / throttle / you_acted / your_fragments），不自己算結果 */
.hud{padding:0;}
.hud::before{display:none}
.hudtop{display:flex;align-items:center;gap:var(--sp2);color:var(--bar-tx)}
.hudtop .who2{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:var(--lh-tight)}
.hudtop .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hudtop .rl{font-size:var(--fs-xs);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hudbd{display:flex;flex-direction:column;}
.hudmain{display:grid;gap:var(--sp2)}
/* 「還能行動 N 次」＝整塊最大的字（C：最顯眼） */
.acttile{height:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:var(--sp2) var(--sp1);
  }
.acttile .atl{font-size:var(--fs-xs);font-weight:800;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.acttile .atn{display:flex;align-items:baseline;gap:2px;line-height:1}
.acttile .atn b{display:inline-block;}
.acttile .atn small{font-size:var(--fs-s);font-weight:700;}
.acttile .atsub{font-size:var(--fs-xs);line-height:1.3;text-align:center}
.acttile .atsay{margin-top:2px;font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.acttile.go{animation:glow 2.4s ease-in-out infinite}


@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:var(--glow)}}
.pips{display:flex;gap:var(--sp1);justify-content:center;flex-wrap:wrap}
.pips i{border:2px solid var(--acc);display:inline-block}
.pips i.f{background:var(--acc)}
.acttile.zero .pips i{border-color:var(--line2)}
/* 右邊 3×2 小格：HP／記憶／貨幣 ＋ 力量／敏捷／意志（每格 ≥44px，可點看說明） */
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(6rem,1fr));gap:var(--sp1);min-width:0}
/* 屬性自己一列、每個等寬 ⇒ 用滿整張卡寬（不再擠在左邊） */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(4rem,1fr));gap:var(--sp1);width:100%;margin-top:var(--sp1)}
/* 只剩一顆（例：貨幣）時讓它自己占滿整列，看起來是「單獨一行」而不是擠在左邊 */
.cells .stat:only-child{grid-column:1/-1}
.stat,.attr{height:auto;min-height:var(--tap);display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  text-align:left;min-width:0;font-weight:650}
.stat .sl,.attr .al{display:flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:750;color:var(--tx2);white-space:nowrap;overflow:hidden}
.stat .sl .ic,.attr .al .ic{width:13px;height:13px}
.stat b,.attr b{display:inline-block;font-weight:800;line-height:1.15;white-space:nowrap;color:var(--tx)}
.stat .meter{border-radius:var(--rad-pill);background:var(--tint);overflow:hidden}
.stat .meter i{display:block;height:100%;border-radius:var(--rad-pill)}
.stat.hp .ic{color:var(--good)} .stat.hp .meter i{background:linear-gradient(90deg,var(--good),var(--acc-l))}
.stat.mem .ic{color:var(--lav)} .stat.mem .meter i{background:linear-gradient(90deg,var(--lav),var(--acc-l))}
.stat.coin .ic{color:var(--star)} .stat.coin b{color:var(--star)}
.stat.low .meter i{background:var(--bad)} .stat.low b{color:var(--bad)}
.stat.on,.attr.on,.hchip.on,.acttile.on{border-color:var(--acc);box-shadow:var(--ring)}
.attr .al .ic{color:var(--ig)}
.attr .pips{justify-content:flex-start;gap:2px}
.attr .pips i{width:6px;height:6px;border-width:1.5px;border-color:var(--ig)}
.attr .pips i.f{background:var(--ig)}
@media(max-width:359px){     /* 很窄的手機：「還能行動」改成橫條放上面，小格才有地方寫字 */
  
  .acttile{flex-direction:row;flex-wrap:wrap;gap:var(--sp1) var(--sp2)}
}
.hudrow{display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.noterow{display:flex;flex-direction:column;gap:var(--sp1);margin-top:var(--sp2)}
.noterow .nlbl{font-size:var(--fs-xs);font-weight:700;color:var(--tx2)}
.noterow input{width:100%}
.hchip{height:auto;min-height:var(--tap-s);display:inline-flex;align-items:center;gap:var(--sp1);
  font-size:var(--fs-s);font-weight:700;border:1px solid var(--tint-line);color:var(--tx2);
  max-width:100%;overflow-wrap:anywhere;text-align:left}
.hchip.gold{color:var(--star)}
.hchip.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.hchip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-tx)}
.hchip.loc{background:var(--surface2);border-color:var(--line2);color:var(--tx)}
.hudtop .hchip{min-height:28px;padding:0 var(--sp2);font-size:var(--fs-xs);background:var(--surface);flex:0 0 auto;white-space:nowrap}   /* 深底上要讀得到 */
.hudtip{padding:var(--sp2) var(--sp3);border-radius:var(--rad-m);background:var(--tint);border:1px dashed var(--tint-line);
  font-size:var(--fs-s);line-height:1.6;color:var(--tx);animation:pop .25s ease-out 1}
.hudtip b{color:var(--acc-d)}
.bump{animation:bump .7s ease-out 1}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18);color:var(--good)}100%{transform:scale(1)}}

/* ── 底部固定指令區（手機）：訊息在上、操作在下並固定（ACFUN 的「指令貼著訊息」）。
      JS 把 #actionbox（現在想做什麼？）與 #saybar（發言＋地圖）搬進 #dock；桌機搬回兩欄原位。
      --dock-h 由 JS 依實際高度更新，body 底部讓出同樣的空間，最後一張卡不會被蓋住。 ── */
#saybar .dockrow{display:flex;gap:var(--sp2);align-items:flex-end}
#saybar textarea{flex:1 1 auto;min-width:0;resize:vertical}
#saybtn{display:inline-flex;align-items:center;gap:var(--sp1)}
#actbtn{display:none}   /* 手機＝指令區就在下方，不需要這顆大鈕；桌機才由左欄/右欄釘底 */
.mbx{display:none}     /* ✉ 上的「私訊」字樣：只在桌機左欄底出現 */
.dockbtn{display:none}
.dockmap{flex:0 0 auto;width:var(--tap);padding:0;align-items:center;justify-content:center}
#dock{display:none}
@media(max-width:979px){
  body.has-dock #dock{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:68vh;max-height:68dvh;
    
    padding:var(--sp2) var(--sp3) calc(var(--sp2) + env(safe-area-inset-bottom))}
  #dock>.card{padding:0;margin:0}
  
  @media(hover:hover){#dock>.card:hover{box-shadow:none}}
  #dock #actionbox{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  #dock #actionbox.flash{animation:okdock .8s ease 1}
  #dock #saybar{flex:0 0 auto;border-top:var(--hair)}
  #saybar textarea{resize:none;height:var(--tap);scrollbar-width:none}
  #saybar textarea::-webkit-scrollbar{display:none}
  #saybar textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  
  #saybtn .stx{display:none}
  .dockbtn{display:inline-flex}
  #sayhint{display:none}
  .sayfb:empty{display:none}
  body.has-dock .fab{display:none !important}
  .mapfloat{left:var(--sp2);right:var(--sp2);width:auto;max-height:72vh;max-height:72dvh}
  .mapfloat>.hd{gap:var(--sp1)}
  #mapname{display:none}                               /* 棋盤名已在頂欄；手機上讓位給縮放鈕 */
  body.has-dock .mapfloat{bottom:calc(var(--dock-h) + var(--sp2))}
  input,select,textarea{font-size:var(--fs-l)}        /* ≥16px：iOS 聚焦時不自動放大 */
  
  .card{padding:var(--sp3)}
  
  .hud{padding:0}
  #cta.go #ctabtn{display:none !important}            /* 手機：行動就在正下方的指令區，不需要「去挑行動」 */
}
@keyframes okdock{0%{background:var(--good-bg)}100%{background:transparent}}

/* ── 新手三步（第一次進來才出現在「現在該做」裡；看圖就會） ── */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp2)}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  border-radius:var(--rad-m);font-size:var(--fs-xs);line-height:1.35;color:var(--tx2)}
.step .ic{width:22px;height:22px;}
.step b{font-size:var(--fs-s);color:var(--tx)}
.rhythm .rtx{margin:var(--sp2) 0 0;font-size:var(--fs-xs);color:var(--tx2)}

/* ── 玩法：短版（圖示＋一句話）在上，長版收在 details 裡 ── */
.hs{display:grid;gap:var(--sp2)}
.hs .hi{display:flex;gap:var(--sp3);align-items:center;padding:var(--sp2) var(--sp3);border-radius:var(--rad-m);
  background:var(--surface2);border:1px solid var(--line);color:var(--tx);line-height:1.6}
.hs .hi .ic{width:26px;height:26px;color:var(--acc-d)}
.mbody details{margin-top:var(--sp3)}
.mbody details summary{cursor:pointer;font-weight:750;color:var(--acc-d);min-height:var(--tap-s);display:flex;align-items:center}
@media(max-width:979px){
  .modal{padding:var(--sp2)}
  .modalpanel{max-height:94vh;max-height:94dvh}
  .mbody{padding:var(--sp3)}
  .mhd{padding:var(--sp2) var(--sp3)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* 發言模式：對全桌 / 對 GM */
.saymode{display:flex;gap:var(--sp1);align-items:center;margin-bottom:var(--sp1)}
.smnote{font-size:var(--fs-s);color:var(--tx3);margin-left:auto}
/* ── 私訊（MOMOTALK 式彈窗）：對象＝GM＋其他玩家，內容＝只有雙方看得到 ── */
#momobtn{position:fixed;right:var(--sp3);bottom:calc(var(--dock-h) + var(--sp3));z-index:60;width:46px;height:46px;border-radius:var(--rad-pill);background:var(--acc);color:var(--acc-ink);border:none;box-shadow:var(--sh2);font-size:19px;line-height:1;cursor:pointer;display:none}
#momobtn.on{display:block}
#momobtn:active{transform:scale(.94)}
#momobtn .bdg{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:17px;padding:0 4px;display:none}
#momobox{position:fixed;left:0;right:0;bottom:0;height:min(76vh,560px);height:min(76dvh,560px);z-index:70;background:var(--surface);border-top:1px solid var(--line2);border-radius:var(--rad-l) var(--rad-l) 0 0;box-shadow:var(--sh2);display:none;flex-direction:column}
#momobox.on{display:flex}
@media(min-width:760px){
  /* 平板（760–979，仍是底部 dock 制）：私訊＝右上、地圖鈕＝左下。≥980 的桌機由下面的「桌機四角」整組接管 */
  #momobox{left:auto;right:var(--sp4);top:64px;bottom:auto;width:372px;height:min(560px,calc(100vh - 120px));height:min(560px,calc(100dvh - 120px));border:1px solid var(--line2);border-radius:var(--rad-l)}
  #momobtn{bottom:calc(var(--dock-h) + var(--sp4))}
  .fab{left:var(--sp4);right:auto;bottom:var(--sp4)}
  .mapfloat{left:var(--sp4);right:auto;bottom:72px;width:min(452px,44vw)}
}

/* ── 桌機（≥980）：三欄 app frame ＋ 角落浮窗。
      四角＝兩側欄的頭尾（左上狀態列、左下私聊 ✉、右上地圖鈕、右下行動大鈕）；
      浮出來的三張：地圖＝右上、私訊＝左下、指令區＝右下，各自貼在對應那顆按鈕旁邊。
      --frame-l／--frame-r＝內框左右緣（和兩側欄的外緣對齊）；--frame-top＝內容區上緣（JS 量，syncFrame）。
      放在檔案最後＝一定蓋得掉前面（手機優先）的基礎規則。 ── */
@media(min-width:980px){
  /* 一屏三段（桌機）：左欄＝狀態／席位／私聊，中欄＝這一景／日誌／發言，右欄＝地圖／位置／秘密／行動。
     四角＝兩側欄的頭尾（左上狀態列、左下私聊 ✉、右上地圖、右下行動）；頁面本身不滾——
     要滾的只有中欄的日誌，和左欄的席位、右欄的現在位置這幾張卡。 */
  body{max-width:1720px}
  .wrap{flex-direction:row;}
  :root{--frame-l:max(var(--sp4), calc(50% - 844px)); --frame-r:max(var(--sp4), calc(50% - 844px))}
  
  .colL,.colR{padding-bottom:var(--sp2)}
  
  
  .colC{flex:1 1 0;}
  /* 左欄：狀態釘頂、席位吃掉剩下高度（自己滾）、✉ 釘底 */
  #hud{overflow:visible}
  
  
  #seatsbox{overflow-y:auto;overscroll-behavior:contain}
  #momobtn .mbx{display:inline}
  #momobtn .bdg{top:-5px;right:10px}
  /* 中欄：這一景（最高 46vh，自己滾）→ 日誌（撐滿，唯一會滾的）→ 發言（釘底） */
  #cta{overflow-y:auto;overscroll-behavior:contain}
  
  #storycard .stream,#storycard #log{flex:1 1 auto;overflow-y:auto;min-height:0}
  
  /* 右欄：地圖鈕釘頂、現在的位置吃剩下高度（自己滾）、秘密限高、行動大鈕釘底 */
  #boardbox{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
  #mybox{overflow-y:auto;overscroll-behavior:contain}
  #entrycard{flex:0 0 auto;overflow-y:auto}
  #gmpanel{flex:0 0 auto;overflow-y:auto}
  /* 行動大鈕的樣式在下面「四角改用兩側欄頭尾」那組（會蓋掉手機的浮動角） */
  #actionbox{
             overflow-y:auto;overscroll-behavior:contain;}
  #actionbox.open{display:block}
  /* 手機的基礎規則（.fab／#actbtn／#momobtn 的浮動角、#actbtn 的 display:none）在本檔後面，
     所以桌機這幾條一定要放在最後，才蓋得掉：四角改用兩側欄的頭尾定位。 */
  #actbtn{flex:0 0 auto;height:58px;align-items:center;
          gap:var(--sp2);cursor:pointer;
          }
  
  body #momobtn{flex:0 0 auto;
                font-size:var(--fs-m);align-items:center;
                gap:var(--sp2);}
  .fab{position:static;left:auto;right:auto;top:auto;bottom:auto;flex:0 0 auto;width:100%;height:auto;min-height:40px;
       justify-content:center;border-radius:var(--rad-m)}
  .mapfloat{left:auto;right:var(--frame-r);top:calc(var(--frame-top,96px) + 48px);bottom:auto;
            width:min(452px,44vw);max-height:46vh;max-height:46dvh}
  #momobox{
           border-radius:var(--rad-l)}
}
.momo-hd{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3);}
.momo-hd .ttl{font-weight:700;font-size:var(--fs-l)}
.momo-ppl{display:flex;gap:var(--sp2);overflow-x:auto;padding:var(--sp3);border-bottom:1px solid var(--line)}
.momo-log{flex:1;overflow-y:auto;padding:var(--sp3);display:flex;flex-direction:column;gap:var(--sp2)}
.momo-m{max-width:84%;padding:7px 10px;font-size:var(--fs-m);line-height:1.45;word-break:break-word;white-space:pre-wrap}
.momo-m.me{align-self:flex-end;}
.momo-m.you{align-self:flex-start;}
/* 對方正在輸入／GM 思考中：貼齊左邊、比一般訊息小一號，尾巴三顆跳動的點 */
.momo-day{align-self:center;font-size:var(--fs-xs);color:var(--dim);background:var(--surface2);
           border-radius:var(--rad-pill);padding:2px 10px;margin:2px 0}
.momo-day.new{color:var(--acc);border:1px solid var(--acc);background:transparent}
.momo-t{display:block;font-size:var(--fs-xs);opacity:.6;margin-top:3px;text-align:right}
.momo-m.you .momo-t{text-align:left}
.momo-m.typing{align-self:flex-start;background:var(--surface3);border:1px dashed var(--line2);
               color:var(--dim);font-size:var(--fs-s);display:flex;align-items:center;gap:6px}
.momo-m.typing i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;animation:momobl 1.15s infinite}
.momo-m.typing i:nth-child(2){animation-delay:.18s}
.momo-m.typing i:nth-child(3){animation-delay:.36s}
@keyframes momobl{0%,60%,100%{opacity:.22;transform:translateY(0)}30%{opacity:.95;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.momo-m.typing i{animation:none;opacity:.6}}
.momo-in{display:flex;gap:var(--sp2);padding:var(--sp3);border-top:1px solid var(--line);padding-bottom:calc(var(--sp3) + env(safe-area-inset-bottom))}
.momo-in input{flex:1}

/* 視覺重構 v4：情報頁的靛藍分隔帶、青綠書籤與白色紙面。僅覆寫呈現。 */
:root{
  --bg:#eeeff4;--surface2:#f4f4f9;--surface3:#e9eaf3;
  --tx:#383e67;--tx2:#535b83;--tx3:#596582;--line:#dfe1ec;--line2:#c8ccdf;
  --ig:#4b5082;--rad-s:4px;--rad-m:6px;--rad-l:8px;
  --sh2:0 12px 32px rgba(38,44,90,.18);
  --tr:.18s ease;--card-grad:linear-gradient(180deg,var(--surface),var(--surface));
}
html[data-theme="dark"]{
  
  --tx:#f4f5ff;--tx2:#d0d6f1;--tx3:#c0c9ec;
  --card-grad:linear-gradient(180deg,var(--surface),var(--surface));
}

.bar{color:var(--tx);gap:8px}
.brand .dot{border-radius:0;box-shadow:none;clip-path:polygon(50% 0,65% 35%,100% 50%,65% 65%,50% 100%,35% 65%,0 50%,35% 35%)}

.bar :is(.qbtn,.tbtn,.trbtn){color:var(--tx2);}
.bar .trbtn[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-d);border-color:var(--acc)}

.langs :is(button,select){color:var(--tx2);border-radius:3px}

.bar .pill{color:#fff;}
.card{border-color:var(--line);}
.card::before{display:none}
.card>.hd{min-height:28px}
.card>.hd .t{display:inline-flex;align-items:center;text-transform:none;}
.card>.hd .t>.ic{color:var(--acc-d);width:18px;height:18px}

#cta>.hd{border-bottom:0;}




.hud{border-color:var(--line2)}
.hudtop{padding:12px 14px}

.hudtop .rl{margin-top:4px}
.hudbd{padding:14px;gap:10px}

.acttile .atn b{letter-spacing:-.06em}
.acttile .atn{margin:5px 0}
.pips i{border-radius:2px;width:8px;height:8px}
.stat,.attr{padding:7px 9px;gap:4px}
.stat b,.attr b{font-size:18px}
.cbar{border:0;border-bottom:1px dashed var(--line2);background:transparent;border-radius:0;padding:12px 0;margin:0;gap:6px}
.cbar.me{background:var(--acc-soft);border:0;padding:12px 10px;margin-bottom:4px}
.cbar.npc{background:var(--surface2);padding:12px 10px;border-radius:4px}
.cbar .cn{font-size:var(--fs-l);letter-spacing:.015em}
.cbar .cb2{line-height:1.6}
:is(.k,.chip,.qchip,.pill){border-radius:4px}
.k{height:auto;min-height:20px;padding:1px 6px;font-weight:700}
.hchip{border-color:var(--line);padding:6px 9px}
#storycard>.hd{flex-wrap:wrap;gap:10px}
.logtabs{display:flex;}
.logtabs button{border:0;box-shadow:none;padding:0 10px}

.ev{padding:10px 10px;margin:0;border-bottom:1px dashed var(--line);border-radius:0;border-left-width:2px}
.ev .sayt{border:0;background:var(--surface2);padding:10px 12px;margin-top:6px}
.ev.a-me .sayt{border:0}
.ev.scn{margin:10px 0;padding:12px}

.ev.sys{padding:7px 10px}
#boardbox .feats .chip{background:var(--surface2)}


#saybar textarea{background:var(--surface);border-color:var(--line2)}
@media(hover:hover){.card:hover{box-shadow:var(--sh1);border-color:var(--line2)}}
@media(min-width:980px){
  
  
  
  .colL{flex:0 1 292px;}
  .colR{flex:0 1 286px;}
  
  
  
  .hudbd{padding:12px;gap:8px}
  
}
@media(max-width:979px){
  .bar{padding:7px 10px;gap:5px}.brand{gap:5px}
  .bar :is(.qbtn,.tbtn,.trbtn){min-width:38px;min-height:44px;width:38px}
  .langs select{padding:0 5px;font-size:14px}
  
  #cta{order:-2;}#hud{order:-1}
  #cta .scenetx{margin-top:12px;}
  #seatsbox{order:0}
  .hudbd{padding:12px}.hudtop{padding:10px 12px}
  #storycard>.hd{gap:7px}.logtabs{width:100%}.logtabs button{flex:1;min-width:0;padding:0 6px}
}


/* 控件重構：主操作青綠、次操作靛藍、輔助操作描邊；星紋只用本地 CSS。 */

button{font-weight:750;box-shadow:none;letter-spacing:.015em}

button.ghost{border-color:var(--line2);color:var(--tx2)}
button.sm{border-radius:4px}
:is(.fab,#actbtn){box-shadow:none;background:var(--acc);color:var(--acc-ink);border-radius:6px}
#actbtn{background-image:repeating-linear-gradient(115deg,transparent 0 5px,rgba(255,255,255,.07) 5px 8px)}
body #momobtn{border:1px solid var(--line2);color:var(--tx2);}
#mapfab{color:#fff;}

.arow button{border-color:var(--line);}


.argbox{background:var(--surface2);border:1px solid var(--line2);padding:14px}
.argbox .opt{box-shadow:none;border-color:var(--line2)}

.cmdmsg{border-left:3px solid var(--line2);border-radius:4px}
.cmdmsg.out{border-left-color:var(--star)}
.holdbar,.endbar,.res{border-radius:4px;border-left-width:3px}
.rhythm{background:var(--surface2);border:1px dashed var(--line2);padding:10px}
.step{border:0;border-bottom:2px solid var(--line2);background:var(--surface);padding:8px 4px}
.step .ic{color:var(--acc-d)}
.rhythm .row{margin-bottom:0}

.mhd button{border-color:#8287b1}
.momo-hd .hint{color:#d0d6f1}

.momo-ppl{background:var(--surface2)}
.momo-in input{min-width:0}
.ev.scn .enote,.ev.scn .dim{color:#e0e3f4}
@media(hover:hover){
  button:not(:disabled):hover{box-shadow:none}
  
  .arow button:not(:disabled):hover .ic{color:var(--acc-d)}
  button:is(.stat,.attr):hover{background:var(--surface3);color:var(--tx)}
}
@media(max-width:979px){
  
  #dock #actionbox>.hd{padding-bottom:7px;margin-bottom:8px;}
  
  
  #dock #saybar{padding-top:7px;margin-top:8px}
  #cta .rhythm{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  #cta .steps{gap:5px}.step{padding:5px 3px;gap:1px}.step .ic{width:17px;height:17px}
  #cta .rhythm .rtx{line-height:1.5;margin-top:7px}
  #cta .rhythm .row{bottom:-10px;margin-top:6px}
}


/* 首屏校正：手機景況有自己的捲動範圍，額度不被固定操作列遮住。 */
.ev.scn,.logtabs button.on,.langs button[aria-pressed="true"]{color:#fff}
@media(max-width:979px){
  #cta{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
}

/* 遊戲桌 v5：星軌舞台、角色銘牌與收藏卡框。裝飾不攔截操作。 */
:root{
  --game-ink:#343a70;--game-deep:#292e60;--game-cyan:#0fc5ca;
  --game-gold:#ffe19a;--game-frame:#8990ba;
  --sh1:0 3px 0 rgba(53,60,108,.09),0 8px 20px rgba(53,60,108,.07);
}
html[data-theme="dark"]{--surface:#363e7a;--surface2:#2f366b;--surface3:#444d8c;--bg:#272e60;--line:#505b9a;--line2:#7580bc}

.bar{border-bottom:0;background:linear-gradient(180deg,var(--surface) 65%,var(--surface2));box-shadow:0 3px 0 var(--game-ink),0 5px 0 var(--acc);position:sticky}
.brand span{font-weight:900;}
.brand .dot{flex:0 0 auto;background:linear-gradient(160deg,var(--acc-l),var(--acc));filter:drop-shadow(0 0 4px var(--acc-soft))}
.card{border:1px solid var(--line2);border-radius:5px 16px 5px 16px;box-shadow:var(--sh1);background:linear-gradient(135deg,var(--surface),var(--surface2));}
.card::after{content:"";position:absolute;border:1px solid var(--tint-line);pointer-events:none}
.card>.hd{position:relative;}
.card>.hd .t{font-size:var(--fs-l);color:var(--tx);gap:7px;}
.card>.hd .t::before{font-size:21px;color:var(--acc-d);line-height:1;text-shadow:none}
.card>.hd .t>.ic{display:none}

#cta,#cta.go{isolation:isolate;border-left:0;border-radius:5px 22px 5px 22px;
  color:#fff;}
#cta::before{display:block;}
#cta::after{border-color:rgba(192,210,255,.22)}
#cta>.hd{background:none}
#cta>.hd .t{background:transparent;color:#94f4ef;text-shadow:none;font-size:var(--fs-s);padding:0}
#cta>.hd .t::before{color:#48e0de;font-size:20px}
#cta>.hd .k{border:0;}
#cta .ctatx{color:#fff;}
#cta .ctasub{color:#c9d2f2}

#cta #rhybtn{color:#eef7ff;border-color:#8c98c5;}
#cta .rhythm{background:rgba(17,24,59,.3);border-color:#8994bc;color:#fff}
#cta .rhythm .rtx{color:#d7def7}
#cta .step{border-bottom-color:#52c6ce;color:#d7e8f5}
#cta .step b{color:#fff}#cta .step .ic{color:#6bf1ec}
.hud{border-radius:5px 18px 5px 18px;overflow:hidden}
.hudtop{position:relative;}
.hudtop::after{position:absolute;color:#5fe7dd;font-size:22px;pointer-events:none}
.hudtop .nm{font-weight:900;}
.hudtop .hchip{border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.13)}
.hudmain{grid-template-columns:minmax(106px,36%) minmax(0,1fr)}
.acttile{position:relative;border:1px solid #58e5dc;color:#fff;animation:none}
.acttile .atl,.acttile .atn b{color:#69f1e6}.acttile .atn b{font-style:italic;font-weight:950;}
.acttile .atn small,.acttile .atsub,.acttile .atsay{color:#d1edf1}
.acttile.zero{background:linear-gradient(145deg,#515a86,#394267);border-color:#9aa8c5}
.acttile.zero .atl,.acttile.zero .atn b{color:#d0d7ec}
.acttile .pips i{transform:rotate(45deg);border-radius:1px;border-color:#59e8dd}.acttile .pips i.f{background:#59e8dd}
.stat,.attr{border:1px solid var(--line);border-bottom:3px solid var(--line2);background:linear-gradient(145deg,var(--surface),var(--surface3));}
.stat.coin{background:linear-gradient(145deg,var(--gold-bg),var(--surface));border-color:var(--gold-line)}
.stat.coin b{font-size:24px;font-style:italic}
.attrs .pips i{border-radius:50%}
.meters .meter,.stat .meter{height:6px;box-shadow:inset 0 1px 3px rgba(25,32,64,.18)}
.cbar.me{border-radius:3px 12px 3px 12px;border-left:4px solid var(--acc);box-shadow:inset 0 0 0 1px var(--acc-soft)}
.k.good{border-radius:999px}.k.gold,.hchip.gold{border-color:var(--gold-line);box-shadow:inset 0 0 0 2px var(--gold-bg)}




@media(min-width:980px){.hudtop{padding:11px 14px}}
@media(max-width:979px){
  .brand span{font-size:17px}
  
  
  .card>.hd .t{font-size:15px}
}


/* 遊戲控件：能量膠囊、技能鍵與貨幣收藏框。 */
button:is(.pri,.btn-p,.primary),#actbtn{
  
  
  font-weight:900;
  }
#actbtn{position:relative;overflow:hidden}
#actbtn::before{color:#ecffed;text-shadow:0 2px 0 #149ba7}
#actbtn::after{pointer-events:none}

.bar :is(.qbtn,.tbtn,.trbtn){border-color:var(--line2);}
.langs{border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--surface2)}
.langs button{border-radius:999px}.langs button[aria-pressed="true"]{background:linear-gradient(135deg,#535d99,#343c75);color:#fff}
.bar .pill{border-radius:3px 10px 3px 10px;background:linear-gradient(120deg,#5863a0,#353e78);border:1px solid #949bcb;box-shadow:0 2px 0 rgba(32,40,89,.15)}
#mapfab{border:1px solid #8490bb;}
body #momobtn{border-bottom:3px solid var(--line2);font-weight:800}

.arow button{position:relative;
  
  font-weight:850;color:var(--tx)}
.arow button .ic{filter:drop-shadow(0 2px 0 var(--acc-soft));color:var(--acc-d)}
.arow button.more{border:1px dashed var(--line2);box-shadow:none}
.arow button::after{content:"";position:absolute;pointer-events:none}
.arow button.more::after{display:none}
.argbox .opt{background:linear-gradient(145deg,var(--surface),var(--surface2));}
.argbox .opt.sel{background:var(--acc-soft);}
.argbox .opt.go{border-color:#61e4dd;border-bottom-color:#087c91}
.hchip{background:linear-gradient(145deg,var(--surface),var(--surface3));border-bottom-width:2px}
.hchip.gold{border-color:var(--gold-line)}

.logtabs button.ghost{border:0}

#saybar{border-radius:5px 16px 5px 16px;background:linear-gradient(135deg,var(--surface2),var(--surface));border-bottom:3px solid var(--line2)}
input,textarea,select{border-radius:8px;box-shadow:inset 0 2px 4px var(--tint)}


.mhd b::before,.momo-hd .ttl::before{color:#59e8dd}
@media(hover:hover){
  button:is(.pri,.btn-p,.primary):not(:disabled):hover,#actbtn:not(:disabled):hover{transform:translateY(-2px)}
  .arow button:not(:disabled):hover{color:var(--tx);transform:translateY(-2px)}
  button.ghost:not(:disabled):hover{background:var(--acc-soft);color:var(--tx);border-color:var(--acc)}
  
}
button:active,#actbtn:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 4px rgba(16,35,69,.2)}
@media(max-width:979px){
  .bar .langs{padding:0}.langs select{box-shadow:none}
  body.has-dock #dock{border:1px solid var(--line2);border-top:3px solid #4de2d6;}
  #dock::before{content:"";position:absolute;top:5px;left:calc(50% - 22px);width:44px;height:3px;background:var(--line2);border-radius:999px;pointer-events:none}
  #dock #actionbox>.hd{padding-top:3px;border:0}
  #dock .cmdq{padding:0 6px 0 0;font-size:15px !important}
  #dock .cmdq::before{color:var(--acc-d)}
  
  #dock #saybar{border-bottom:0}
  #dock #saybtn{min-width:44px;padding:0 10px}
  
}
@media(prefers-reduced-motion:reduce){button:hover{transform:none !important}}


/* v6 / BA 形狀語彙：折角情報卡、青色前綴與斜向分隔。 */
:root{--fold:18px;--ba-dot:rgba(73,130,158,.16);--ba-shadow:0 4px 0 var(--tint),0 10px 22px rgba(41,61,104,.09)}

:is(#cta,#hud,#seatsbox,#storycard,#boardbox,#mybox,#saybar){
  border-radius:12px 0 12px 12px;clip-path:polygon(0 0,calc(100% - var(--fold)) 0,100% var(--fold),100% 100%,0 100%);
  border:1px solid var(--line2);box-shadow:var(--ba-shadow);background:linear-gradient(145deg,var(--surface),var(--surface2))}
:is(#cta,#hud,#seatsbox,#storycard,#boardbox,#mybox,#saybar)::before{content:"";display:block;position:absolute;left:auto;right:0;top:0;width:24px;height:24px;border-radius:0;background:linear-gradient(45deg,transparent 43%,var(--acc) 44%,var(--acc) 50%,transparent 51%);opacity:1;pointer-events:none;z-index:2}
.card::after{inset:5px;border-radius:8px 0 8px 8px;border-color:var(--tint-line)}
.card>.hd{background:none;border-bottom:0;padding-bottom:12px;margin-bottom:12px}
.card>.hd::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:repeating-linear-gradient(125deg,var(--acc-soft) 0 4px,transparent 4px 7px);pointer-events:none}
.card>.hd .t{background:transparent;padding-right:0;font-weight:850;text-shadow:none;letter-spacing:.035em}
.card>.hd .t::before{content:"";width:5px;height:19px;flex:0 0 auto;border-radius:1px;background:var(--acc);box-shadow:0 0 6px var(--acc-soft)}
#cta,#cta.go{border:1px solid #8899bf;background:radial-gradient(ellipse at 95% 0,rgba(42,201,210,.23),transparent 65%),linear-gradient(135deg,#46558a,#313b6a);box-shadow:var(--ba-shadow)}
#cta::before{left:auto;right:0;top:0;}
#cta>.hd{padding-bottom:12px;margin-bottom:12px}
#cta>.hd::after{background:repeating-linear-gradient(125deg,rgba(139,237,234,.35) 0 4px,transparent 4px 7px)}
#cta>.hd .t::before{width:5px;height:16px;background:#68e7df}
#cta>.hd .k{border-radius:999px;background:#79ece2;color:#173e53;transform:none;padding:3px 10px;box-shadow:none}
#cta .ctatx{font-size:26px;text-shadow:0 2px 0 rgba(20,30,65,.45)}

.hudtop{background:linear-gradient(120deg,#4c588d,#343e70);border-bottom:3px solid #62e2d9}
.hudtop::after{content:"";width:38px;height:38px;right:12px;bottom:7px;border:1px solid rgba(156,245,240,.2);transform:rotate(45deg)}
.hudtop .nm{font-style:normal;font-size:22px;letter-spacing:.03em;text-shadow:none}
.acttile{border-radius:9px 0 9px 9px;background:radial-gradient(ellipse at 50% 0,rgba(111,255,242,.2),transparent 80%),linear-gradient(145deg,#3d5981,#2b416b);box-shadow:inset 0 0 0 3px rgba(74,219,215,.1)}
.acttile .atn b{font-size:50px;text-shadow:0 2px 0 #24355d}
.stat,.attr{border-radius:7px 0 7px 7px;border-bottom-width:2px;box-shadow:none}
.hchip,.k,.chip,.qchip{border-radius:999px}
.hchip.gold{border-radius:6px;background:var(--gold-bg);box-shadow:none}
#mybox{border-top:2px solid var(--star)}
#mybox .hd .t::before{background:var(--star);color:inherit}
.ev.scn{border-radius:8px 0 8px 8px;background:linear-gradient(120deg,#4b588e,#354172);box-shadow:none;border-left:3px solid #75e5df}
.ev.scn .ebd{font-size:var(--fs-m)}
#cta .step{border-radius:6px;background:rgba(255,255,255,.09)}
@media(max-width:979px){
  
  #dock>.card{clip-path:none;box-shadow:none;border:0;border-radius:0;background:transparent}
  #dock>.card::before,#dock>.card::after{display:none}
  #dock #actionbox>.hd{background:none;border-bottom:0}
  #dock #actionbox>.hd::after{height:3px}
  #dock .cmdq{background:transparent}
  #dock .cmdq::before{width:5px;height:17px;background:var(--acc);font-size:0}
}


html[data-theme="dark"]{--ba-dot:rgba(145,183,214,.08)}

/* BA 操作語彙：青色標籤、圓角矩形與前進三角；保留靛藍場景基調。 */
button:is(.pri,.btn-p,.primary),#actbtn{border-radius:7px;border:1px solid #87e9e1;border-bottom:2px solid #0a94a2;
  background:linear-gradient(145deg,#69e8de,#21c7cf);color:#123f53;box-shadow:inset 0 1px 0 #b0f7ef,0 3px 0 rgba(23,119,145,.12);text-shadow:none}
#actbtn{font-size:18px;letter-spacing:.06em;border-radius:10px 0 10px 10px;justify-content:space-between;padding:0 22px}
#actbtn::before{content:"";width:9px;height:9px;border:2px solid #effffa;transform:rotate(45deg);font-size:0}
#actbtn::after{position:static;inset:auto;border-radius:0;font-size:28px;line-height:1;color:#174b60}
#ctabtn::after,.argbox .opt.go::after{font-size:17px;margin-left:5px}
button.ghost{border-radius:6px;background:var(--surface);box-shadow:none}
#cta #rhybtn{border-radius:6px;background:rgba(255,255,255,.08)}
.bar :is(.qbtn,.tbtn,.trbtn){border-radius:6px;background:var(--surface2);box-shadow:none}
.brand span{font-style:normal;letter-spacing:.01em;text-shadow:none}
.brand .dot{width:18px;height:24px}
#mapfab{border-radius:8px 0 8px 8px;background:linear-gradient(120deg,#546094,#384776);border-bottom:2px solid #5edfd6;box-shadow:none}
#mapfab::after{margin-left:auto;color:#89efe6;font-size:21px}
body #momobtn{border-radius:8px;background:var(--surface);border-bottom-width:2px;box-shadow:none}

.arow button::after{width:9px;height:9px;top:0;right:0;background:linear-gradient(45deg,transparent 45%,var(--acc) 46%);transform:none}
.arow button.more{border-radius:8px;border-bottom:1px dashed var(--line2)}
.argbox .opt.go{border-radius:7px;background:linear-gradient(145deg,#69e8de,#21c7cf);color:#123f53}
.logtabs{box-shadow:none;}
.logtabs button.ghost{box-shadow:none;}

#saybtn{border-radius:7px;min-width:44px}


.mhd b::before,.momo-hd .ttl::before{vertical-align:-2px}
@media(hover:hover){
  button:is(.pri,.btn-p,.primary):not(:disabled):hover,#actbtn:not(:disabled):hover{background:linear-gradient(145deg,#aff9ec,#52dedf);color:#123f53;box-shadow:inset 0 1px 0 #dcfff7,0 3px 8px rgba(19,171,182,.25)}
  .arow button:not(:disabled):hover{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--surface);border-color:var(--acc)}
}
@media(max-width:979px){
  body.has-dock #dock{border-radius:12px 0 0 0;background:linear-gradient(120deg,var(--surface),var(--surface2));box-shadow:0 -4px 0 var(--acc-soft),0 -8px 20px rgba(26,33,78,.12)}
  #dock #saybtn,#dockmap{border-radius:7px}
  
}


/* 地圖：格子紙、青綠側邊標記與等角平台；SVG 在容器內縮放／捲動。 */
#mapbox{min-width:0;overflow:hidden;padding:12px;border-radius:5px 14px 5px 14px;border:1px solid var(--line2);border-left:8px solid var(--acc);background:var(--surface);box-shadow:var(--sh2)}
#mapbox::after{display:none}
#mapbox>.hd{flex-wrap:wrap;gap:5px;background:var(--surface);padding-bottom:10px}
#mapbox>.hd .t{background:var(--acc);color:var(--acc-ink);padding:4px 9px;border-radius:3px;font-weight:850}
#mapbox>.hd .t::before{display:none}
#mapbox>.hd .t .ic{display:inline-block;color:inherit}

/* ── v7 桌機版面（統一幾何）：左上狀態疊、左下景區、中下日誌＋發言、右下行動區——四塊的位置只由這幾個變數算，
   保證互不重疊（以前各輪各寫各的 left／width，1024～1440 寬時行動區會壓到日誌 50～60px）。
   --lstack＝左上「狀態＋席位」那一疊的底（JS syncLeftStack 量；量不到退回舊值）；
   --rail-w＝右下行動區寬；--ctx-w＝左下景區寬；
   日誌寬＝min(理想寬, 兩側讓開後剩下的寬)；能置中就置中，放不下就夾在左下景區與行動區之間。 */
@media(min-width:980px){
  body{--rail-w:414px;--ctx-w:calc(var(--hud-left) - 8px);--col-gap:12px;
       --log-w:min(var(--hud-log), calc(100vw - 2 * var(--hud-edge) - var(--ctx-w) - var(--rail-w) - 2 * var(--col-gap)));
       --log-x:clamp(calc(var(--hud-edge) + var(--ctx-w) + var(--col-gap)), calc(50vw - var(--log-w) / 2),
                     calc(100vw - var(--hud-edge) - var(--rail-w) - var(--col-gap) - var(--log-w)))}
  #storycard,#saybar{left:var(--log-x)!important;transform:none!important;width:var(--log-w)!important}
  #actionbox{width:var(--rail-w)!important}
  /* 左欄：「只有你看得到／席位／私訊」那一排緊貼在狀態疊下面，「留守の間に」再下一列（不再釘死在 +310px） */
  body #mybox,body #seatsbox>details,body #momobtn{top:var(--lstack,calc(var(--hud-edge) + 310px))!important;bottom:auto!important}
  body .return-recap{top:calc(var(--lstack,calc(var(--hud-edge) + 310px)) + 40px)!important;bottom:auto!important}
  body .r23-context{max-height:min(300px,calc(100vh - var(--lstack,330px) - 96px - var(--hud-edge)))!important}
  .logtabs button{white-space:nowrap}
  body .return-recap{width:var(--hud-left)!important}
  /* 觀戰／未入座：「只有你看得到」不顯示 ⇒ 「席」貼回左緣，不留一塊空位 */
  body:has(#mybox[style*="display:none"],#mybox[style*="display: none"]) #seatsbox>details{left:var(--hud-edge)!important}
  body .return-recap summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 左下景區的引導列：說明字自己一行，兩顆鈕在下一行（以前三者擠一行，說明字被壓到剩 9px） */
  .r23-context #rhythm .row{flex-wrap:wrap}
  .r23-context #rhythm .guide-line{flex:1 1 100%}
  /* 行動區：一排＝大顆「移動」＋ N 顆快捷＋「ほか」；N 由 renderActs 依行動區寬算（放不下的進「ほか」），
     不再讓圓鈕往左溢出壓到日誌。尺寸刻度：大／小／ほか／間距。 */
  body{--r24-l1:124px;--r24-l2:92px;--r24-l3:70px;--rail-gap:16px}
  #actionbox .arow:first-child{gap:var(--rail-gap)!important}
  /* 服裝立繪：狀態帶「名字那一列」的小鈕＋點開才出現的浮層。

     縮圖只在打開時才載入（服裝圖是原寸立繪，覺醒版一張就上 MB）。 */
  /* 桌機的 .hudtop 是「頭像｜名字」兩欄的 grid：外框 display:contents 不佔格，鈕貼名字那一列的右端、浮層貼卡的左緣往下開 */
  #hud .hudtop>#artpick{display:contents}
  #hud .hudtop:has(>#artpick) .nm{padding-right:62px!important}
  #artpick>.artpick-btn{position:absolute;right:0;top:0;z-index:2;height:24px!important;min-height:0!important;box-sizing:border-box;padding:0 10px;border:0;border-radius:999px;background:rgba(90,194,201,.2);color:var(--glass-ink,#263a65);font:inherit;font-size:12px;font-weight:700;line-height:24px;cursor:pointer;white-space:nowrap}
  #artpick>.artpick-btn:hover,#artpick.open>.artpick-btn{background:rgba(90,194,201,.38)}
  #artpick .artpick-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:80;display:flex;gap:8px;padding:10px;border-radius:14px;background:var(--glass,#f9f9f7);color:var(--glass-ink,#263a65);box-shadow:0 8px 24px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
  #artpick .artpick-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border:2px solid transparent;border-radius:10px;background:none;color:inherit;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  #artpick .artpick-opt:hover{background:rgba(90,194,201,.14)}
  #artpick .artpick-opt img{width:64px;height:92px;object-fit:cover;object-position:50% 20%;border-radius:6px;background:#0d1526}
  #artpick .artpick-opt[aria-checked="true"]{border-color:#5ac2c9}
  #artpick .artpick-btn:focus-visible,#artpick .artpick-opt:focus-visible{outline:2px solid #5ac2c9;outline-offset:2px}
  /* 景文卡：長景文（＋結局／暫停橫幅把它往下推）時不准伸到日誌底下——可用高度由 JS 量（syncSceneFit），
     超出就在卡內捲動；還有下文時底邊淡出，看得出「下面還有」。 */
  #cta #scenetx.fit{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  #cta #scenetx.fit.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent);mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
  /* 「只有你看得到」打開時：狀態卡變成一張完整的角色卡。
     原本沿用收合時的窄欄（208px）＋高度只剩「視窗 − 日誌 − 96px」⇒ 四條棒擠成一排只剩標籤、名字壓在棒上、
     底下的席位從半透明卡後面透出來。⇒ 卡放寬（夠寬就停在日誌左邊；1000px 這種窄桌機讓不開，就當浮層蓋上去，加陰影看得出在上層）、
     往下長到按鈕列為止；棒一條一列（有軌有值）；席位先收起來（反正被蓋住）。 */
  body:has(#mybox details[open]) #hud{width:clamp(260px,calc(var(--log-x) - var(--hud-edge) - var(--col-gap)),360px)!important;max-height:calc(100dvh - 2 * var(--hud-edge) - 56px)!important;background:#f7fbff!important;box-shadow:0 10px 32px rgba(9,20,44,.28)!important}
  html[data-theme="dark"] body:has(#mybox details[open]) #hud{background:#1b2540!important}
  body:has(#mybox details[open]) .hud-seats{display:none!important}
  body:has(#mybox details[open]) #hud .hudtop{height:auto!important;min-height:0!important;align-items:center;gap:4px 8px}
  body:has(#mybox details[open]) #hud .hudtop .who2{flex:1 1 140px;min-width:0}
  body:has(#mybox details[open]) #hud .hudtop:has(>#artpick) .nm{padding-right:0!important}
  body:has(#mybox details[open]) #artpick>.artpick-btn{position:static}
  body:has(#mybox details[open]) #hud .hudbars{display:grid!important;grid-template-columns:1fr;gap:6px;margin:8px 0 0}
  body:has(#mybox details[open]) #hud .hudbar{display:flex!important;align-items:center;gap:8px;width:100%!important;max-width:none!important;position:static!important}
  body:has(#mybox details[open]) #hud .hudbar .bl{flex:0 0 auto}
  body:has(#mybox details[open]) #hud .hudbar .bt{display:block!important;flex:1 1 auto;min-width:40px}
  body:has(#mybox details[open]) #hud .hudbar b{flex:0 0 auto;display:inline!important}
}

  body{--hud-log:clamp(320px,40vw,560px);--r24-l1:112px;--r24-l2:84px;--r24-l3:64px;--rail-gap:14px}
  /* 窄桌機：場景卡讓開左欄那排按鈕（1024 寬時會壓到「私訊」） */
  #cta{left:max(calc(var(--hud-edge) + 318px + 210px), 50vw)!important;right:auto!important}   /* 卡寬 420、以 translateX(-50%) 置中 ⇒ left 是中心點 */

.momo-line .momo-av{width:34px;height:34px}
#momobox .momo-line .momo-m{position:relative;max-width:calc(100% - 52px);font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px!important}
#momobox .momo-line .momo-m.you{color:#263a65!important;background:#f9f9f7!important}
#momobox .momo-line.last .momo-m.you{border-bottom-left-radius:3px!important}
#momobox .momo-line.last .momo-m.me{border-bottom-right-radius:3px!important}
#momobox .momo-line.last .momo-m::after{content:"";position:absolute;bottom:0;width:10px;height:10px;background:inherit}
#momobox .momo-line.last .momo-m.you::after{left:-6px;clip-path:polygon(100% 0,100% 100%,0 100%)}
#momobox .momo-line.last .momo-m.me::after{right:-6px;clip-path:polygon(0 0,100% 100%,0 100%)}
#momobox .momo-line .momo-t{font-weight:400}
#momobox .momo-line.typing .momo-m{font-weight:400}
html[data-theme="dark"] .momo-row{background:rgba(255,255,255,.08);color:#e6ecf5}
html[data-theme="dark"] .momo-row.on{background:var(--chat-me);color:#fff}
html[data-theme="dark"] #momobox .momo-line .momo-m.you{background:#24314f!important;color:#e6ecf5!important}

/* ── 頂欄最終佈局（2026-10-19 設計者：「PC 佈局也會遮擋」）────────────────────────
   地圖鈕住進 .bar，位置交給 flex；不再有任何 fixed 偏移。
   #sub（地點那行字）也改成 flex 子項，空間不夠就省略，不會壓到按鈕上。 */
.bar #mapfab{position:static!important;left:auto!important;right:auto!important;top:auto!important;
  height:var(--r24-l4)!important;min-height:var(--r24-l4)!important;align-self:center!important;
  margin:0!important;z-index:auto!important;width:var(--r24-l4)!important;min-width:var(--r24-l4)!important;
  height:var(--r24-l4)!important;min-height:var(--r24-l4)!important;max-height:none!important;padding:3px!important;
  background:transparent!important;border:0!important;box-shadow:none!important;
  flex:0 0 auto!important;flex-direction:column!important;gap:2px!important;box-sizing:border-box}
@media(min-width:980px){.bar #mapfab_tx{display:inline!important;font-size:13px!important;line-height:18px!important;white-space:nowrap}}
@media(max-width:979px){.bar #mapfab{width:38px!important;min-width:38px!important;height:38px!important;
  padding:0!important;flex-direction:column!important;gap:0!important}.bar #mapfab_tx{display:none!important}}
.bar #sub{right:480px!important;max-width:none!important}


.bar #mapfab::after{content:none!important;display:none!important;border:0!important;width:0!important}

/* 設定鈕（2026-10-19）：改成 <button aria-expanded> + 面板，不再用 <details>/<summary>；
   summary 的箭頭裝飾一併移除，跟頂欄其他按鈕同一個樣子。 */
.preferences>#prefsbtn::after{content:none!important;display:none!important;border:0!important}
.preferences-body[hidden]{display:none!important}
</style>

  <div class="hd"><span class="t"><svg class="ic" aria-hidden="true"><use href="#i-piece"/></svg><span data-i18n="sum_title">结算／战况</span></span>
    <span class="spacer"></span>
    <button class="ghost sm" onclick="toggleSum(false)" data-i18n="sum_close">收起</button></div>
  <div class="sumwrap" id="sumwrap"></div>
</section>

<!-- ★account 層：login UI（追 token 進場；agent 側用同一把 token 走 MCP／HTTP）——
     owner 2026-10-08：**不再掛在頁面流裡**（那張卡會落在畫面中央），改成彈窗：頂欄「登入」開、✕／點背景關。
     ⚠ 沒憑證或 403 時仍然**自動彈**（2026-10-07 定案「沒憑證就彈登入面板」），只是彈的是彈窗。 -->
<div class="modal" id="authmodal" role="dialog" aria-modal="true" aria-labelledby="authtitle">
  <div class="modalpanel" style="max-width:560px">
    <div class="mhd"><b id="authtitle" data-i18n="auth_title">登入（account）</b>
      <button class="ghost sm" onclick="closeAuth()" aria-label="关闭" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="mbody"><div id="authwrap" class="sumwrap"></div></div>
  </div>
</div>

<!-- 玩法＝大弹窗（首次进入自动弹出；之后随时用顶栏「玩法说明」打开） -->
<div class="modal" id="howtomodal" role="dialog" aria-modal="true" aria-labelledby="howtotitle">
  <div class="modalpanel">
    <div class="mhd"><b id="howtotitle" data-i18n="howto">怎么玩</b>
      <button class="ghost sm" onclick="closeHowto()" aria-label="关闭" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="mbody" id="howtomodalbody"></div>
    <div class="mft"><button class="pri" id="howtocta" onclick="closeHowto()" data-i18n="howto_cta">知道了，开始玩</button></div>
  </div>
</div>

<!-- 私訊（MOMOTALK 式）：只有你和對方看得到。✉ 按鈕在左欄底（手機＝浮動角） -->
<div id="momobox" role="dialog" aria-label="私訊" data-i18n-aria="momo">
  <div class="momo-hd">
    <span class="momo-hav" id="momoav" aria-hidden="true"></span>
    <span class="momo-who"><span class="ttl" id="momottl">私訊</span><span class="hint" id="momowho"></span></span>
    <button class="chip momo-listbtn" id="momolistbtn" onclick="momoList()" aria-pressed="false"><span data-i18n="momo_list">列表</span><span class="k bad" id="momolistn" style="display:none"></span></button>
    <button class="chip" onclick="momoClose()" aria-label="關閉" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="momo-ppl" id="momoppl"></div>
  <div class="momo-log" id="momolog"></div>
  <div class="momo-in">
    <input id="momotext" placeholder="說一句…" data-i18n-ph="momo_ph" oninput="momoPing()">
    <button class="btn-p" onclick="momoSend()" data-i18n="send">送出</button>
  </div>
</div>

  howto_body:`<b>目標</b>：登上「百鬼塔」頂層，向<b>願星</b>許願。另外每個人還有一個<b>私密願望</b>（在「只有你看得到」卡裡）。<br>
   <b>一景＝一回合</b>：GM 開景 → 你在景裡行動（每景有次數上限）→ 全員都出手 → GM 收景、寫下一景。<br>
   <b>常用行動</b>（在「現在想做什麼？」點一個 → 點選項就送出；沒有選項的按「執行」）：<br>
   ・走路 → <b>移動</b>（也可以點地圖上的綠圈）<br>
   ・找東西／找塔的入口 → <b>搜索</b>　・進塔 → 站在塔前（金色節點）再按<b>進塔</b><br>
   ・塔裡上下樓 → <b>搭昇降機</b>　・頂層許願（拿神器，代價是記憶）→ <b>祈願</b><br>
   ・要搶同一樣東西 → <b>宣告爭奪</b>（收景時<b>同時</b>揭曉，不是手快先得）<br>
   ・手上有碎片 → <b>給人看碎片</b>／<b>送出碎片</b>　・這景不想動 → <b>這景不動</b><br>
   <b>塔的規矩</b>：入口每局換位置，要用<b>搜索</b>找；同一層只能往上；<b>在塔裡吃東西／休息會被塔吞掉記憶</b>；一個祈願箱<b>一局只開一次</b>。<br>
   <b>記憶</b>＝你的資源：撿到「有意義的記憶」會加，待在塔裡會掉；見底會被送回原點。<br>
   <b>想說話隨時說</b>：輸入框按 Enter 即可，行動和發言可以同時進行。`,

  howto_body:`<b>目的</b>：「百鬼塔」の最上階へ登り、<b>願い星</b>に願う。それとは別に、各人に<b>私的な願い</b>が一つ（「あなただけ」カードに表示・自分だけ見える）。<br>
   <b>1景＝1ラウンド</b>：GM が開景 → 景の中で行動（1景ごとに回数の上限あり）→ 全員が行動したら GM が収景、次の景へ。<br>
