/* ======================================================================
   三語取值層：玩家看得到的字，一律從這裡拿。
   - loc(v)：欄位若是 {jp,cn,tw}／{ja,zh_Hans,zh_Hant} 這種物件就取當前語言；字串原樣。
   - locf(o,k)：同上，但也認兄弟欄位 k_tw／k_cn／k_jp…（例：party[].where ＋ where_cn）。
   - 繁中沒有自己的版本時退到簡中（原樣顯示，不做繁簡轉換）；都沒有就原文。
   - 引擎給的自由文字（景文、GM 台詞、日誌備註、劇本名）沒有對應語言就照原文；要不要送即時翻譯由 TX()（下面「即時翻譯」）決定，
     這一層本身不翻。
   ====================================================================== */
const LOC_KEYS = {"zh-Hant":["tw","zh_Hant","zh-Hant","zh_tw","hant"], "zh-Hans":["cn","zh_Hans","zh-Hans","zh_cn","hans","zh"], "ja":["jp","ja"]};
const LOC_SUF  = {"zh-Hant":["_tw","_zh_Hant","_hant"], "zh-Hans":["_cn","_zh_Hans","_hans"], "ja":["_jp","_ja"]};
const LOC_FALL = {"zh-Hant":["zh-Hant","zh-Hans"], "zh-Hans":["zh-Hans","zh-Hant"], "ja":["ja"]};
function loc(v){
  if(v == null) return "";
  if(typeof v !== "object") return String(v);
  if(Array.isArray(v)) return v.map(loc).filter(Boolean).join("、");
  for(const l of LOC_FALL[LANG]) for(const k of LOC_KEYS[l]) if(typeof v[k] === "string" && v[k]) return v[k];
  for(const l of LANGS) for(const k of LOC_KEYS[l]) if(typeof v[k] === "string" && v[k]) return v[k];   // 只有別種語言：給原文
  for(const k in v) if(typeof v[k] === "string" && v[k]) return v[k];                                 // 認不得的形狀：第一個字串，不留 undefined
  return "";
}
function locf(o, key){
  if(!o) return "";
  for(const l of LOC_FALL[LANG]) for(const s of LOC_SUF[l]){ const x = o[key+s]; if(typeof x === "string" && x) return x; }
  return loc(o[key]);
}
/* 碎片的名字：優先 view 給的 name（帶 jp/cn 就按語言挑），沒有才退回 id。
   f_xxx 是後台鍵——只在真的沒名字時才露出來，免得玩家看到出戲。 */
function GF(f){ if(!f) return ""; return locf(f, "name") || loc(f.name) || t("a_fragment"); }
/* 地名：日＝map.jp、簡中＝map.cn；資料若自帶 tw／zh_Hant 欄位以資料為準，
   沒有的話用模組用語表的 `places`（節點 id → 譯名；作品的地名不寫死在這支頁面），再沒有就退到簡中原文。 */
function modPlace(id){ const e = id && MODLOC.places[id]; return (e && (e[LANG] || "")) || ""; }
function nodename(n){
  if(!n) return "";
  const id = n.id || n.to;
  if(LANG === "ja") return n.jp || n.ja || n.cn || id || "";
  if(LANG === "zh-Hans") return n.cn || n.zh_Hans || modPlace(id) || n.jp || id || "";
  return n.tw || n.zh_Hant || modPlace(id) || n.cn || n.jp || id || "";
}
/* 副標＝劇本名：引擎給的常是「棋盤名 ── 劇本名（註）」，棋盤名已經是大標 ⇒ 去掉重複的開頭與尾註（全文留在 title 提示） */
function subTitle(scn, heads){
  let s = String(scn || "").trim();
  for(const h of heads){
    const x = String(h || "").trim();
    if(x && s.startsWith(x) && s.length > x.length){ s = s.slice(x.length).replace(/^[\s─—–\-:：・|｜]+/, ""); break; }
  }
  return shortName(s) || String(scn || "");
}
/* 地圖上的短標籤：去掉尾巴的（說明） */
const shortName = s => String(s || "").replace(/\s*[（(][^（）()]*[）)]\s*$/, "") || String(s || "");
/* 固定名詞（神器名、派系、定位、棋盤名）：原文（日文，與引擎資料逐字相同）→ 模組用語表 `glossary` 的譯名；
   日文版就是原文本身。模組沒收錄的照原文。 */
function gl(s){
  if(s == null) return "";
  if(typeof s === "object") return loc(s);
  const k = String(s).trim(), e = MODLOC.glossary[k];
  if(!e) return String(s);
  if(LANG === "ja") return e.ja || k;
  for(const l of LOC_FALL[LANG]) if(e[l]) return e[l];
  return k;
}
/* 引擎的「固定系統句」（不是 GM／玩家寫的自由文字）：整句對照或固定句型 → 字典；其餘照原文 */
const SYS = {"塔内滞在で記憶が薄れる":"rs_tower_fade", "「意味のある」記憶を拾った":"rs_memory_found", "塔内饮食（一体化）":"rs_tower_eat",
  "探索が長すぎる——塔から弾き出された":"rs_kicked_out", "exit_tower":"rs_exit_self"};
/* 系統句的 HTML：字典認得的照字典（三語），認不得的（引擎／GM 寫的自由句）才送翻譯 */
function sysTX(s){
  const v = sysText(s);
  return (typeof s === "string" && v === s.trim()) ? TX(v) : esc(v);
}
function sysText(s){
  if(s == null || s === "") return "";
  if(typeof s === "object") return loc(s);
  const str = String(s).trim();
  if(SYS[str]) return t(SYS[str]);
  let m = /^神器「(.+)」を得た代償（tier (\d+)）$/.exec(str);
  if(m) return t("rs_art_cost", {name:gl(m[1]), n:m[2]});
  m = /^「(.+)」の主を討った$/.exec(str);
  if(m){ const nd = ((MAP && MAP.nodes) || []).find(x => x.jp === m[1]); return t("rs_boss_of", {node: nd ? nodename(nd) : m[1]}); }
  return str;
}

/* ======================================================================
   即時翻譯：桌上的「公開自由文字」（景文、GM 敘事、日誌裡各席的發言／備註、地點描述、劇本名）翻成當前 LANG。
   - 只有呼叫 TX(s) 的地方會翻。私密區（you.* / your_* / your_secrets / seen_by_you）、自己的發言、輸入框、
     行動結果（只有你收到的回傳）、I18N 字典文字一律不經過 TX → 不送出去。
   - 譯文直接取代原文，前面一枚小標記（譯文／原文）；點那則文字切換（景文裡點標記，點文字仍是展開／收合）。
   - 還沒回來＝照原文＋淡標記先佔位；回來後就地換字（不重畫整區）。失敗＝照原文、標記拿掉，不出任何錯誤訊息。
   - 只送「這次畫面上出現、還沒翻過、且看起來不是當前語言」的句子，一輪合成一個 /translate_batch；
     結果記在本頁（TRC，另存 sessionStorage），同一句不再問。中文↔中文（繁簡）不送：服務也把它當同語。
   - 服務位址：預設 TR_DEFAULT；網址加 ?tr=http://主機:埠 可覆蓋（只對這次開的頁有效，不記在本機）。
   - 私密防線（PR #10）：①句子含「本頁已知的私密字串」（your_goal／your_secrets／seen_by_you／your_declarations）
     就整句不送（第二層；引擎側已修 wish_done／settle 帶私密 title）；
     ②`action:"wish"` 的宣言 note 不送——不是因為它是引擎模板（家側拍板：note 是玩家自己寫的），
     而是不替玩家把它放大到服務上；代價是別的席位的願望宣言不翻。
   ====================================================================== */
const TR_DEFAULT = "http://127.0.0.1:8982";
const TR_URL = (new URLSearchParams(location.search).get("tr") || TR_DEFAULT).replace(/\/+$/, "");
let TR_ON = localStorage.getItem("trpg_translate") !== "off";    // 預設開
const TRC = new Map();        // key(LANG+原文) → {s:"pend"|"ok"|"same"|"fail", tx, n(失敗次數)}
const TRSHOW = new Set();     // 使用者點過「看原文」的 key
const TRID = new Map(), TRBY = new Map();   // key ↔ 短 id（DOM 上的 data-tx）
const TRQ = new Map();        // 等著送的 key → 原文
const TRSTAT = {req:0, items:0, ok:0, fail:0};   // 自測用：發了幾個請求、幾句（console 打 TRSTAT 可看）
let TRT = null, TRBUSY = false, TRCTL = null, TRWAIT = 0, TRFAILS = 0, TRSAVE = null;
const TRBATCH = 24;
/* 私密字串遮罩：本頁「已知只有我看得到」的字串（your_goal.*、your_secrets.*、seen_by_you.*、your_declarations.*）。
   送翻譯前先比對：句子裡只要含到任何一條，就整句不送——寧可不翻，也不讓私密字串離開桌子。
   引擎側 2026-10-05 已修掉 wish_done／settle 帶私密 title 的問題（家側）；這層是**第二層**：
   只要本頁知道那是我的私密字串，不管它被塞進哪一句公開文字，都不出去。 */
let TRPRIV = [], TRPRIVV = null;
function trPrivList(){
  if(TRPRIVV === V) return TRPRIV;
  const a = [];
  const put = x => { if(typeof x !== "string") return; x = x.trim(); if(x.length >= 2 && x.length <= 200) a.push(x); };
  const P_ = V || {}, G = P_.your_goal || {};
  put(G.title); put(G.text); put(G.note);
  (P_.your_secrets || []).forEach(s => { put(s.title); put(s.text); put(s.name); });
  (P_.seen_by_you || []).forEach(s => put(s.text));
  (P_.your_declarations || []).forEach(s => { put(s.note); put(s.text); });
  a.sort((x, y) => y.length - x.length);   // 長的先比，短的不會先命中而遮不乾淨
  TRPRIV = a; TRPRIVV = V;
  return TRPRIV;
}
const trHasPriv = x => { for(const p of trPrivList()) if(x.includes(p)) return true; return false; };
const KANA = /[぀-ヿㇰ-ㇿｦ-ﾟ]/, HAN = /[㐀-鿿豈-﫿]/;
try{ (JSON.parse(sessionStorage.getItem("trpg_tr_cache") || "[]")).forEach(([k, tx]) => TRC.set(k, tx == null ? {s:"same"} : {s:"ok", tx})); }catch(e){}
function trSave(){
  clearTimeout(TRSAVE);
  TRSAVE = setTimeout(() => {
    const a = []; TRC.forEach((e, k) => { if(e.s === "ok") a.push([k, e.tx]); else if(e.s === "same") a.push([k, null]); });
    try{ sessionStorage.setItem("trpg_tr_cache", JSON.stringify(a.slice(-800))); }catch(e){}
  }, 800);
}
/* 桌上已知的專有名詞：席位名、名冊（名字＋派系）、隊伍、地圖節點（jp＋cn，含去掉括號說明的短名）、棋盤名、
   字典裡的神器名／派系名（日文原文）、日誌裡公開拿到的神器名。全部是公開資料；不讀 you.*。 */
let TRGL = null, TRGLV = null;
function trGlossary(){
  if(TRGL && TRGLV === V) return TRGL;
  const S = new Set();
  const add = x => { if(typeof x !== "string") return; x = x.trim(); if(x.length < 2 || x.length > 40) return; S.add(x);
    const sh = shortName(x).trim(); if(sh.length >= 2) S.add(sh); };
  const B = (V && V.board) || {};
  ((V && V.seats) || []).forEach(s => add(s.name));
  (B.roster || []).forEach(r => { add(r.name); add(r.faction); });
  (B.party || []).forEach(p => add(p.name));
  ((MAP && MAP.nodes) || []).forEach(n => { add(n.jp); add(n.cn); });
  if(MAP) add(MAP.board_name);
  add(B.name);
  for(const k in MODLOC.glossary) if(MODLOC.glossary[k].kind !== "role") add(k);   // 定位（刀／射手…）是普通名詞，不擋翻譯
  ((V && V.log) || []).forEach(e => { if(e.type === "artifact_gained" || e.type === "artifact_revealed") add(e.name); });
  TRGLV = V;
  return TRGL = [...S].sort((a, b) => b.length - a.length);
}
/* 原文大概是哪種語言（只用來決定「要不要送」，真正的判斷交給服務）：先把專有名詞拿掉，免得中文句裡的カガリ被當成日文 */
const TRSRC = new Map();
function trSrc(s){
  if(TRSRC.has(s)) return TRSRC.get(s);
  let x = s; for(const g of trGlossary()) if(x.includes(g)) x = x.split(g).join(" ");
  const r = KANA.test(x) ? "ja" : HAN.test(x) ? "zh" : /[A-Za-z]{3,}/.test(x) ? "other" : null;   // 純數字／符號／名字＝不送
  if(TRSRC.size > 3000) TRSRC.clear();
  TRSRC.set(s, r); return r;
}
const trWant = s => { if(trHasPriv(s)) return false; const r = trSrc(s); return !!r && (LANG === "ja" ? r !== "ja" : r !== "zh"); };
const trKey = s => LANG + "␟" + s;
function trIdOf(k, s){ let id = TRID.get(k); if(!id){ id = "t" + TRID.size.toString(36); TRID.set(k, id); TRBY.set(id, {k, s}); } return id; }
/* 某一句此刻該長什麼樣：{c:class, m:標記字, x:顯示的字, ok:可切換} */
function trLook(k, s){
  const e = TRC.get(k);
  if(e && e.s === "ok"){ const o = TRSHOW.has(k); return {c:"tx ok" + (o ? " orig" : ""), m:t(o ? "tr_orig" : "tr_mark"), x:o ? s : e.tx, ok:true, o}; }
  if(e && e.s === "pend" && !e.quiet) return {c:"tx pend", m:t("tr_mark"), x:s};
  return {c:"tx", m:"", x:s};
}
const trAttrs = L_ => L_.ok ? ` role="button" tabindex="0" title="${esc(t(L_.o ? "tr_tap_tr" : "tr_tap_orig"))}"` : "";
/* 公開自由文字 → HTML。own＝自己寫的（不翻）。回傳已跳脫的 HTML */
function TX(s, own){
  s = s == null ? "" : String(s);
  if(!s.trim() || !TR_ON || own || !trWant(s)) return esc(s);
  const k = trKey(s);
  let e = TRC.get(k);
  if(!e || (e.s === "fail" && (e.n || 0) < 8 && !TRQ.has(k))){
    e = {s:"pend", n:(e && e.n) || 0, quiet:!!e}; TRC.set(k, e); TRQ.set(k, s); trKick();   // quiet＝失敗後的重試：照原文、不再亮標記
  }
  if(e.s === "same" || e.s === "fail") return esc(s);
  const id = trIdOf(k, s), L_ = trLook(k, s);
  return `<span class="${L_.c}" data-tx="${id}"${trAttrs(L_)}><span class="txm">${esc(L_.m)}</span>${esc(L_.x)}</span>`;
}
/* 就地重畫某幾句（翻譯回來／點了切換／失敗）：只動那幾個 span，日誌若原本貼底就繼續貼底 */
function trPaint(keys){
  const lg = $("log"), stick = lg && lg.scrollHeight - lg.scrollTop - lg.clientHeight < 48;
  keys.forEach(k => {
    const id = TRID.get(k); if(!id) return;
    const s = TRBY.get(id).s, L_ = trLook(k, s);
    document.querySelectorAll(`[data-tx="${id}"]`).forEach(el => {
      el.className = L_.c;
      el.innerHTML = `<span class="txm">${esc(L_.m)}</span>${esc(L_.x)}`;
      if(L_.ok){ el.setAttribute("role", "button"); el.tabIndex = 0; el.title = t(L_.o ? "tr_tap_tr" : "tr_tap_orig"); }
      else { el.removeAttribute("role"); el.removeAttribute("tabindex"); el.removeAttribute("title"); }
    });
  });
  if(lg && stick) lg.scrollTop = lg.scrollHeight;
}
function trFlip(id){
  const it = TRBY.get(id); if(!it) return;
  if(TRSHOW.has(it.k)) TRSHOW.delete(it.k); else TRSHOW.add(it.k);
  trPaint([it.k]);
}
/* 點譯文＝切原文（capture：景文框自己的「點一下展開」不要同時觸發） */
document.addEventListener("click", e => {
  const x = e.target.closest && e.target.closest(".tx.ok[data-tx]"); if(!x) return;
  if(x.closest("#scenetx") && !e.target.closest(".txm")) return;

/* 送：一輪攢一批（同一次重畫裡出現的全部），一次只有一個請求在路上；服務掛了就退避，不狂打 */
function trKick(){
  if(TRT || TRBUSY || !TR_ON || !TRQ.size) return;
  TRT = setTimeout(trSend, Math.max(60, TRWAIT - Date.now()));
}
async function trSend(){
  TRT = null;
  if(!TR_ON || TRBUSY || !TRQ.size) return;
  const lang = LANG;
  const batch = [...TRQ].filter(([k]) => k.startsWith(lang + "␟")).slice(0, TRBATCH);
  [...TRQ.keys()].filter(k => !k.startsWith(lang + "␟")).forEach(k => { TRQ.delete(k); TRC.delete(k); });   // 換過語言：舊語言的就不送了
  if(!batch.length) return;
  batch.forEach(([k]) => TRQ.delete(k));
  TRBUSY = true; TRCTL = new AbortController();
  const ctl = TRCTL, timer = setTimeout(() => ctl.abort(), 25000);
  TRSTAT.req++; TRSTAT.items += batch.length;
  const done = [];
  try{
    const r = await fetch(TR_URL + "/translate_batch", {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
      body:JSON.stringify({target:lang, glossary:trGlossary(), items:batch.map(([k, s], i) => ({id:String(i), text:s}))})});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), got = {};
    (j.results || []).forEach(x => { if(x && x.id != null) got[String(x.id)] = x; });
    batch.forEach(([k, s], i) => {
      const x = got[String(i)], tx = x && typeof x.translation === "string" ? x.translation : "";
      if(!x){ TRC.set(k, {s:"fail", n:9}); }
      else if(!tx.trim() || tx.trim() === s.trim() || x.source === lang){ TRC.set(k, {s:"same"}); }
      else { TRC.set(k, {s:"ok", tx}); TRSTAT.ok++; }
      done.push(k);
    });
    TRFAILS = 0; TRWAIT = 0;
    trSave();
  }catch(err){
    const byUser = !TR_ON;                      // 使用者關掉翻譯 → 中斷，不算服務壞
    if(!byUser){ TRFAILS++; TRWAIT = Date.now() + Math.min(300000, 15000 * Math.pow(2, TRFAILS - 1)); TRSTAT.fail++; }
    batch.forEach(([k]) => {
      const e = TRC.get(k) || {};
      if(byUser) TRC.delete(k);
      else TRC.set(k, {s:"fail", n:(e.n || 0) + 1});   // 靜靜降級：照原文。下次重畫時再出現的句子會在退避後重試（最多 3 次）
      done.push(k);
    });
  }finally{
    clearTimeout(timer); TRBUSY = false; TRCTL = null;
  }
  trPaint(done);
  trKick();
}

/* ★ 子路徑模式（單一入口）：後端送頁面時會注入 `window.TRPG_BASE`（例："/hyakki_tower"）。
   沒有子路徑（直接連桌埠）⇒ 空字串，行為與以前一字不變。**localStorage 的鍵不變**——
   單一 origin ⇒ 登入一次，所有桌通用。 */
const BASE = (typeof window.TRPG_BASE === "string") ? window.TRPG_BASE : "";
/* ★2026-10-08 修（owner 實測「觀戰頁面什麼都看不到」）：GraphQL 端點要**照後端給的走**——
   觀戰頁在 `/<桌>/watch` 底下，它該打的是**唯讀前門自己的** `/<桌>/watch/graphql`
   （桌頁則是 `/<桌>/graphql`；兩者不是同一個路徑，硬拼會錯）。
   ① 後端注入的**相對路徑**（`/…/graphql`）＝權威，直接用；
   ② 絕對位址只認連得到的——`127.0.0.1`／`localhost` 是**後端自己機器**的 loopback（別台機器連不到）；
   ③ 都沒有 ⇒ 落回 `BASE + "/graphql"`（BASE 已含 `/watch` ⇒ 正確落在唯讀前門）。
   ⚠ 曾經寫成「把 BASE 尾端 /watch 去掉」＝錯的方向（那會打到帳號桌的一般端點、沒憑證就被 403）。 */
const GQL_URL = (function(){
  const g = (typeof window.TRPG_GQL === "string") ? window.TRPG_GQL.trim() : "";
  if(g.charAt(0) === "/") return g;
  if(g && !/^https?:\/\/(127\.0\.0\.1|localhost|\[::1\])(:|\/|$)/i.test(g)) return g;
  return BASE + "/graphql";
})();
/* ★2026-10-08（owner：「/api/* 关掉是设计，现在都用graphql了」）：這一支**不再是 REST**——
   舊路徑翻譯成 GraphQL（跟橋側 `trpg_client` 同一張對照表；呼叫點一字不動，行為一樣）。
   好處：① 不依賴相容旋鈕 ② POST ⇒ 不會被瀏覽器快取（先前那顆被快取的 410 就是 GET 惹的）。 */
/* 舊路徑 → [GraphQL 欄位, [[引數名(＝舊 body 的鍵), 變數名, 型別], …]]（與橋側 trpg_client 同一張表） */
const _ROUTE = {
  "/api/join":  ["join",  [["name", "n", "String!"], ["kind", "k", "JoinKind"],
                           ["seat", "seat", "ID"], ["attrs", "at", "JSON"]]],
  "/api/act":   ["act",   [["action", "a", "String!"], ["seat", "seat", "ID"], ["target", "tg", "ID"],
                           ["attr", "at", "String"], ["dc", "dc", "Int"], ["note", "nt", "String"],
                           ["skill", "sk", "ID"], ["item", "it", "ID"]]],
  "/api/say":   ["say",   [["text", "tx", "String!"], ["seat", "seat", "ID"]]],
  "/api/tell":  ["tell",  [["to", "to", "ID!"], ["text", "tx", "String!"], ["seat", "seat", "ID"]]],
  "/api/typing":["typing",[["seat", "seat", "ID"], ["to", "to", "ID"]]],
  "/api/gm":    ["gmRun", [["op", "op", "String!"], ["args", "ag", "JSON"]]],
  "/api/pick_char": ["pickChar", [["charId", "cd", "ID!"], ["name", "nm", "String"]]],
};
async function api(path, body){
  if(WATCH) return {error: t("watch_readonly")};   /* 唯讀態：畫面已沒有入口，這裡再擋一層 */
  const spec = _ROUTE[path];
  if(!spec) return {error: "no route: " + path};
  const [field, map] = spec;
  const b = Object.assign({}, body || {});
  if(AUTH_TOKEN){
    b.token = AUTH_TOKEN;                          /* ★ 自動帶帳號憑證（GraphQL 這裡走標頭） */
    if(!GMVIEW) delete b.seat;                     /* ★ 身分只認 token（伺服器會蓋） */
  }
  const vars = {}, decl = ["$t: ID!", "$s: ID!"], args = ["tableId: $t", "session: $s"];
  (map || []).forEach(([arg, varName, type]) => {
    decl.push("$" + varName + ": " + type);
    args.push(arg + ": $" + varName);                 /* ⚠ 引數名（GraphQL schema）≠ 變數名（這裡縮寫） */
    vars[varName] = (b[arg] !== undefined) ? b[arg] : null;
  });
  const q = `mutation(${decl.join(", ")}){ ${field}(${args.join(", ")}) }`;
  try{
    const d = await gql(q, Object.assign({t: tableId(), s: await gqlSession()}, vars));
    return d && d[field] !== undefined ? (d[field] || {}) : {};
  }catch(e){
    /* 失敗訊息一律收斂成 `error`（呼叫點只看這個）；斷線另給 `__net`（契約：conn_lost） */
    const msg = String((e && e.message) || e);
    if(/(Failed to fetch|NetworkError|load failed)/i.test(msg)){
      $("sub").textContent = t("conn_lost");
      return {__net: true};
    }
    return {error: msg};
  }
}

function errOf(r){ return (r && (r.error || (r.result && r.result.error) || r.__err)) || null; }

    case "move": return can.some(c=>c.kind!=="elevator") ? null : "why_move";
    case "ride": return can.some(c=>c.kind==="elevator") ? null : "why_ride";
    case "enter": return H.type==="monolith_entry" ? null : "why_enter";

async function doAct(p, key, btn){
  const A = PICK; if(!A || BUSY) return;
  const body = Object.assign({seat:SEAT, action:A}, p);
  const note = String(ARGV.note || "").trim();
  if(!["show","give"].includes(A) && note) body.note = note;
  if(A === "check"){ const dc = String(ARGV.dc || "").trim(); if(/^\d+$/.test(dc)) body.dc = +dc; }
  const local = (A === "use" || A === "other") && !note ? t("need_note")
    : (A === "cast") && !body.skill ? t("need_skill")
    : (A === "use_item") && !body.item ? t("need_item")
    : (A === "rescue") && !body.target ? t("need_rescue_tgt")
    : (A === "show" || A === "give") && (!body.target || !body.note) ? t("need_both") : null;
  if(local){ REJ = {key, msg:local}; PRESSED = key; $("acts")._h = null; renderActs(); return; }
  hideErr();
  BUSY = true; PRESSED = key; REJ = null;
  if(btn){ btn.classList.add("busy"); btn.setAttribute("aria-busy", "true"); }   // 同一個事件裡就進「進行中」，不等重繪
  renderActs();
  const pre = Math.max(0, ...((V.log||[]).map(e=>e.seq||0)));
  const r = await api("/api/act", body);
  BUSY = false;
  const err = r.__net ? t("conn_lost") : errOf(r);
  if(err){                                  // 被拒／断线：原因寫在那顆按鈕下面，選項留著讓玩家改了再按
    REJ = {key, msg:err}; $("acts")._h = null;
  } else {
    RES = {a:A, body, result:r.result||{}, evs:((r.view||{}).log||[]).filter(e=>(e.seq||0)>pre), no:(V.stage||{}).no};
    PICK = null; ARGV = {}; PRESSED = null; MOREOPEN = false;
    if(r.view && r.view.stage !== undefined) V = r.view;
  }
  try{ render(); }catch(e2){ showErr(e2.message); }
  if(!err){ const ab = $("actionbox"); ab.classList.remove("flash"); void ab.offsetWidth; ab.classList.add("flash"); }
  poll();
}

/* ---------------- 地图：缩放（＋/− / Ctrl+滚轮 / 双指）＋ 拖动平移 ---------------- */
let ZOOM = 1;
function applyZoom(focal){
  const wrap = $("mapwrap"), svg = $("mapsvg");
  if(!wrap || !svg || !GEO) return;
  const oldW = svg.width.baseVal.value || GEO.W, oldH = svg.height.baseVal.value || GEO.H;
  const fx = focal ? focal.x : wrap.clientWidth/2, fy = focal ? focal.y : wrap.clientHeight/2;
  const rx = (wrap.scrollLeft + fx) / Math.max(1, oldW);
  const ry = (wrap.scrollTop  + fy) / Math.max(1, oldH);
  const W = GEO.W*ZOOM, H = GEO.H*ZOOM;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  wrap.scrollLeft = rx*W - fx; wrap.scrollTop = ry*H - fy;
  if($("mapzoom")) $("mapzoom").textContent = Math.round(ZOOM*100) + "%";
}
function zoomBy(f, focal){
  if(f === 1){ ZOOM = 1; applyZoom(); centerMapOnYou(); return; }   // 点百分号＝复位
  ZOOM = Math.max(0.5, Math.min(3, ZOOM*f));
  applyZoom(focal);
}
(function mapGestures(){
  const wrap = $("mapwrap"); if(!wrap) return;
  // Ctrl/⌘ + 滚轮缩放（普通滚轮＝原生滚动，符合地图惯例）
  wrap.addEventListener("wheel", e => {
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, {x: e.clientX - r.left, y: e.clientY - r.top});
  }, {passive:false});
  // 鼠标拖动＝平移（触屏走原生滚动）
  let drag = null;
  wrap.addEventListener("pointerdown", e => {
    if(e.pointerType === "touch") return;
    drag = {x:e.clientX, y:e.clientY, sl:wrap.scrollLeft, st:wrap.scrollTop, moved:false, id:e.pointerId};
    wrap.classList.add("panning");
  });
  wrap.addEventListener("pointermove", e => {
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    /* 真的拖動了才抓指標：一按下就 setPointerCapture 的話，click 會被改送到 wrap，節點永遠點不到 */
    if(!drag.moved && Math.abs(dx) + Math.abs(dy) > 4){ drag.moved = true; wrap.setPointerCapture && wrap.setPointerCapture(drag.id); }
    wrap.scrollLeft = drag.sl - dx; wrap.scrollTop = drag.st - dy;
  });
  wrap.addEventListener("pointerup", () => {
    if(!drag) return;
    const moved = drag.moved; drag = null; wrap.classList.remove("panning");
    if(moved){   // 拖过就不算「点节点」——吞掉这一次 click
      const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
      wrap.addEventListener("click", stop, {capture:true, once:true});
    }
  });
  // 触屏双指缩放
  let pinch = null;
  wrap.addEventListener("touchstart", e => {
    if(e.touches.length === 2){
      const a = e.touches[0], b = e.touches[1];
      pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: ZOOM};
    }
  }, {passive:true});
  wrap.addEventListener("touchmove", e => {
    if(!pinch || e.touches.length !== 2) return;
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const r = wrap.getBoundingClientRect();
    zoomBy((pinch.z * d / Math.max(1, pinch.d)) / ZOOM,
          {x:(a.clientX+b.clientX)/2 - r.left, y:(a.clientY+b.clientY)/2 - r.top});
    pinch.z = ZOOM; pinch.d = d;
    e.preventDefault();
  }, {passive:false});
  wrap.addEventListener("touchend", () => { pinch = null; });

async function entryTake(mode, charId, name){

                {t: tableId(), s: ENTRY.session, c: charId, n: (name || null)});

/* 拖动（只在桌面/鼠标；移动端全宽贴底，不需要拖） */
(function mapDrag(){
  const head = $("mapdrag"), box = $("mapbox");
  let dx=0, dy=0, dragging=false;
  const pos = JSON.parse(localStorage.getItem("trpg_mappos_v2") || "null");
  if(pos && window.innerWidth >= 980){ Object.assign(box.style, {left:pos.x+"px", top:pos.y+"px", right:"auto", bottom:"auto"}); }
  head.addEventListener("pointerdown", e => {
    if(window.innerWidth < 980 || box.parentNode === $("cta") || e.target.closest("button")) return;
    dragging = true; box.classList.add("dragging");
    const r = box.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
    box.setPointerCapture && box.setPointerCapture(e.pointerId);
  });
  window.addEventListener("pointermove", e => {
    if(!dragging) return;
    const x = Math.min(Math.max(4, e.clientX - dx), window.innerWidth - box.offsetWidth - 4);
    const y = Math.min(Math.max(4, e.clientY - dy), window.innerHeight - 60);
    Object.assign(box.style, {left:x+"px", top:y+"px", right:"auto", bottom:"auto"});
  });
  window.addEventListener("pointerup", () => {
    if(!dragging) return; dragging = false; box.classList.remove("dragging");
    const r = box.getBoundingClientRect();
    localStorage.setItem("trpg_mappos_v2", JSON.stringify({x:Math.round(r.left), y:Math.round(r.top)}));
  });
})();

  const nx = MAP.nodes.map(n => Number(n.x)), ny = MAP.nodes.map(n => Number(n.y));

      `<path d="M${X} ${Y-20} L${X+40} ${Y} L${X} ${Y+20} L${X-40} ${Y} Z" fill="${MC("node")}" stroke="${stroke}" stroke-width="${isHere?3:2}"` +

      `</g>`;
    if(isCan) s += `<circle cx="${X}" cy="${Y}" r="20" fill="transparent" onclick="pickMove('${n.id}')" style="cursor:pointer"/>`;   // 手指點得到（≈40px）
    const {label,floor}=placements[n.id];
    s += `<text class="map-label" x="${label.x}" y="${label.y}" text-anchor="${label.anchor}" font-size="12" fill="${MC("text")}"><title>${esc(nodename(n))}</title>${esc(label.text)}</text>`;
    if(floor) s += `<text class="map-label" x="${floor.x}" y="${floor.y}" text-anchor="${floor.anchor}" font-size="12" fill="${MC("text")}">${esc(floor.text)}</text>`;
    if(n.danger>=3) s += `<text x="${X+10}" y="${Y-7}" font-size="9.5" fill="${MC("danger")}">${esc(t("danger_mark"))}</text>`;
  });
  // 以平台、圖示與避讓後標籤的實際繪圖範圍 fit；縮放／置中仍讀同一份 GEO。
  const bounds=[...platforms,...labels];
  const bx=Math.min(...bounds.map(b=>b.x))-8,by=Math.min(...bounds.map(b=>b.y))-8;
  const bw=Math.max(...bounds.map(b=>b.x+b.w))-bx+8,bh=Math.max(...bounds.map(b=>b.y+b.h))-by+8;
  const wrap=$("mapwrap"),bs=getComputedStyle(box),ws=getComputedStyle(wrap);
  const panelW=box.clientWidth || parseFloat(bs.width) || Math.min(innerWidth-16,600);
  const W=wrap.clientWidth || Math.max(160,panelW-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight)-8);
  const H=wrap.clientHeight || (parseFloat(ws.height)-2) || 300;
  const fit=Math.min((W-12)/bw,(H-12)/bh);
  const ox=(W-bw*fit)/2-bx*fit,oy=(H-bh*fit)/2-by*fit;
  GEO = {minX:minX-ox/(S*fit),minY:minY-oy/(S*fit),S:S*fit,W,H};
  const sv = $("mapsvg");
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  sv.setAttribute("preserveAspectRatio", "xMidYMid meet");
  sv.setAttribute("width", W*ZOOM); sv.setAttribute("height", H*ZOOM);
  sv.innerHTML = `<g class="map-art" transform="translate(${ox} ${oy}) scale(${fit})">${s}</g>`;
  /* 队友位置（塔内只给「塔内」——信息防火墙在服务端就已经裁好了） */
  const party = ((V||{}).board||{}).party || [];
  const pb = $("partychips");
  const chip = p => `<span class="chip${p.hidden_floor?"":" p"}">${IC(isPlayerSeat(p.kind) ? "people" : "send")} ${esc(p.name)} @ ${esc(locOf(p.seat) || locf(p, "where") || "—")}` +
    `${p.kind==="npc"?` <span class="k">${esc(t("kind_npc"))}</span>`:""}</span>`;
  if(pb){
    /* NPC 不進名冊：他們只從對話與場景裡出現，位置由 GM 決定（玩家看不到也不需要看到） */
    const players = party.filter(p=>p.is_party !== false && p.kind !== "npc");
    pb.innerHTML = players.length ? `<div class="hint" style="margin-top:4px">${t("party")}</div>` +
        players.map(chip).join("") : "";
  }
  const dot = (c, label) => `<span><i style="background:${c}"></i>${label}</span>`;
  /* ★3-a 圖例：地形／邊（原本就有）＋**節點小徽章**的說明（商店／祈願箱／遊戲室／小怪／塔前） */
  $("maplegend").innerHTML = [t("feat_shop"), t("feat_game"), t("feat_wish", {t: 1}),
      t("feat_enemy", {n: "n"}), t("feat_entry")]
      .map(x => `<span class="chip lgdchip">${esc(x)}</span>`).join("") +
    dot(MC("here"), t("map_you")) + dot(MC("can"), t("map_can")) +
     `<span class="hint">${t("map_legend")}</span>`;
}

async function gm(op){

/* ----------------------------- 事件人话化 ----------------------------- */
/* 公开日志是「每一席的动作都看得见」的地方。每条事件＝［谁］＋一句谓语（白话），视觉上分：
   自己（青绿）／GM（金）／玩家（靛）／AI（紫）／NPC（灰）／系统（淡灰）。未知型别一行灰字，不抛错。
   收景事件的景号：引擎会给 no；旧事件流没有，就沿用「前一个 scene_open.no／事件带的 scene_no」，真的没有就不写号码，绝不显示 ?／undefined。
   前端只显示引擎给过的号码，不自己推算（红线 2）。 */
let LAST_SCENE_NO = null;
const seatsList = () => (V && V.seats) || [];
/* 席位的「玩家」判據（owner 2026-10-08 實測回報：看不到坐席裡的隊友、也私訊不了隊友）：
   桌的對外投影把 human／agent **一律壓成 `player`**（玩家平等原則：agent 不知道誰是人、
   人也不知道誰是 agent）⇒ 前端不可以再去挑 "human"／"agent"——挑了＝兩邊都挑不到 ⇒
   席位名冊空、私訊對象也空。舊值留著是給還沒壓的來源（相容）。 */
const isPlayerSeat = k => k === "player" || k === "human" || k === "agent";
const isMe = id => !!(V && V.you && id === V.you.seat);
const kindOf = id => id === "gm" ? "gm" : ((seatsList().find(s => s.seat === id) || {}).kind || "");
const actorCls = id => isMe(id) ? "me" : (kindOf(id) || "human");
function who(id){
  const k = kindOf(id);
  return `<span class="who">${esc(NM(id))}</span>` +
    (isMe(id) ? ` <span class="k good">${esc(t("you_mark"))}</span>` : (k === "agent" ? ` <span class="k pur">AI</span>` : ""));
}
const tgt = id => `<b>${esc(isMe(id) ? t("you_mark") : NM(id))}</b>`;
/* 地点名。塔内他人的具体层数不外露：对方 hidden_floor 时，塔内楼层一律只写「塔内」（红线 5） */
function nodeLabel(id, seat){
  if(id == null) return "";
  const m = ((MAP && MAP.nodes) || []).find(x => x.id === id) || (((V||{}).board||{}).can_go||[]).find(x => x.to === id);
  if(m && m.type === "tower_floor" && seat && !isMe(seat)){
    const p = (((V||{}).board||{}).party || []).find(x => x.seat === seat);
    if(p && p.hidden_floor) return t("in_tower");
  }
  return m ? nodename(m) : String(id);
}
const itemName = k => ITEMS.includes(k) ? t("item_"+k) : k;
function rollText(r){
  const mod = r.mod ? (r.mod > 0 ? "+" + r.mod : String(r.mod)) : "";
  let h = t("lg_roll", {die:esc(r.die), value:`<b>${esc(r.value)}</b>`, mod:esc(mod), total:`<b>${esc(r.total)}</b>`});
  if(r.dc != null) h += " · " + t("lg_roll_dc", {dc:esc(r.dc), res:`<b>${r.success ? IC("check") + esc(t("roll_ok")) : IC("ban") + esc(t("roll_no"))}</b>`});
  return h;
}
/* 擲骰的理由：引擎的機器格式（"search hyakki"／"fight mob"／"pray to wish box"）→ 行動名＋地名；
   玩家自己寫的理由（自由文字）照原文 */
function rollWhy(ev){
  const r = locf(ev, "reason"); if(!r) return "";
  const tk = r.split(" "), nodeIds = ((MAP && MAP.nodes) || []).map(x => x.id);
  if(tk[0] === ev.kind && L("act_"+tk[0]) && tk.slice(1).every(x => nodeIds.includes(x) || ["mob","to","wish","box"].includes(x))){
    const nd = tk.slice(1).find(x => nodeIds.includes(x));
    return esc(actLabel(tk[0]) + (nd ? " @ " + nodeLabel(nd, ev.seat) : tk.includes("mob") ? " · " + t("src_mob") : ""));
  }
  return TX(r, isMe(ev.seat));
}
/* 一个行动宣告 → 一句话（不含主语）。给日志、席位卡的「最近」、行动结果共用 */
function actPhrase(ev){
  const a = ev.action, to = ev.target, seat = ev.seat;
  const nd = id => `<b>${esc(nodeLabel(id, seat))}</b>`;
  const note = ev.note, isSeat = id => seatsList().some(s => s.seat === id);
  const fid = (typeof to === "string" && /^f\d+$/i.test(to)) ? esc(to) : null;
  const toSeat = (typeof note === "string" && isSeat(note)) ? note : null;
  switch(a){
    case "move": return to ? t("lg_move",{to:nd(to)}) : t("lg_move_any");
    case "ride": return to ? t("lg_ride",{to:nd(to)}) : t("lg_ride_any");
    case "search": return t("lg_search");
    case "enter": return t("lg_enter");
    case "exit_tower": return t("lg_exit_tower");
    case "fight": return t("lg_fight");
    case "pray": return t("lg_pray");
    case "buy": { const it = ITEMS.includes(to) ? to : (ITEMS.includes(note) ? note : null);
      return it ? t("lg_buy",{item:`<b>${esc(itemName(it))}</b>`}) : t("lg_buy_any"); }
    case "rescue": return t("lg_rescue",{to:`<b>${esc(NM(ev.target))}</b>`});
    case "use_item": { const x = (((V.you||{}).items)||[]).find(y => y.id === ev.item) || {};
      const nm3 = `<b>${esc(gl(x.name_jp || ev.item || ""))}</b>`;
      return to ? t("lg_use_item",{s:nm3, to:`<b>${esc(NM(to))}</b>`}) : t("lg_use_item",{s:nm3, to:""}); }
    case "cast": { const s = (((V.you||{}).skills)||[]).find(x => x.id === ev.skill) || {};
      const nm = `<b>${esc(gl(s.name_jp || ev.skill || ""))}</b>`;
      return to ? t("lg_cast",{s:nm, to:`<b>${esc(NM(to))}</b>`}) : t("lg_cast_self",{s:nm}); }
    case "game": return t("lg_game");
    case "rest": return t("lg_rest");
    case "declare": { if(!to) return t("lg_declare_any");
      const m = /^(\w+)@(.+)$/.exec(String(to));
      const what = m ? `${esc(L("act_"+m[1]) || m[1])} @ ${esc(nodeLabel(m[2], seat))}` : esc(isSeat(to) ? NM(to) : to);
      return t("lg_declare",{what:`<b>${what}</b>`}); }
    case "show": return (fid && toSeat) ? t("lg_show",{fid, to:tgt(toSeat)}) : t("lg_show_any");
    case "give": return (fid && toSeat) ? t("lg_give",{fid, to:tgt(toSeat)}) : t("lg_give_any");
    case "wish": return t("lg_wish");
    case "pass": return t("lg_pass");
    case "attack": return to ? t("lg_attack",{to:tgt(to)}) : t("lg_attack_any");
    case "check": return t("lg_check");
    case "defend": return t("lg_defend");
    case "use": return ITEMS.includes(note) ? t("lg_use",{item:`<b>${esc(itemName(note))}</b>`}) : t("lg_use_any");
    case "other": return t("lg_other");
    default: return t("lg_act_x",{action:esc(a)});
  }
}
/* 行动宣告里玩家自己写的那句话（原样显示；show/give 的 note 是对象席位、买/用的 note 可能只是物品代号，不当旁白） */
function actNote(ev){
  const n = ev.note;
  if(typeof n !== "string" || !n || ["show","give"].includes(ev.action)) return "";
  if(ITEMS.includes(n) || seatsList().some(s => s.seat === n)) return "";
  /* 家側 §2 拍板：note 是**玩家自己寫的**自由句（引擎原樣帶過、不是模板）；依 (a) 它屬公開事件。
     這裡仍然不翻，理由不是「擋引擎洩漏」，是**不替玩家放大**：願望宣言常會夾帶玩家自己的私密內容
     （`your_goal.note` 只寫「可以暗示、可以交易，別直接念出來」——軟規則，引擎不審查）。
     代價：別的席位的願望宣言不會被翻譯（照原文看得到）。要改成照翻，一句話我就拿掉。 */
  if(ev.action === "wish") return esc(locf(ev, "note"));
  return TX(locf(ev, "note"), isMe(ev.seat));
}
const rowOf = (cls, ico, actor, body, note) =>

/* fmtParts：{cls, ico, actor, body, note}；null＝不显示 */

      return {cls:"act", ico:"dice", actor:s, body:t("lg_decl_roll",{node:esc(nodeLabel(ev.node, s)), value:esc(r.value), mod:esc(r.mod ? (r.mod>0?"+"+r.mod:r.mod) : ""),

    case "declare_won": return {cls:"big", ico:"check", actor:s, body:t("lg_decl_won",{node:`<b>${esc(nodeLabel(ev.node, s))}</b>`}) +

function fmt(ev){

  const p = fmtParts(ev);

  if(!p) return `<div class="ev unk a-sys"><div class="ebd">${esc(t("lg_unknown",{type:String(ev.type)}))}${ev.seat ? " · " + esc(NM(ev.seat)) : ""}</div></div>`;
  return p.say ? sayRow(p.actor, p.text) : rowOf(p.cls, p.ico, p.actor, p.body, p.note);
}
let LOGSIG = "", LOGALL = false;
const LOGN = 30;      // 預設只畫最近 30 條（ACFUN 的「顯示最新 N 條／顯示全部」），想看更早的再展開
function logToggle(){ LOGALL = !LOGALL; LOGSIG = ""; renderLog(); }
/* ★3-b 日誌篩選：全部／只看對話（`say`／`npc_say`／`tell`…）／只看事件（其餘） */
let LOGFILTER = "all";
const TALK_TYPES = ["say", "tell", "npc_say", "gm_say", "whisper", "voice"];
function logFilter(kind){
  LOGFILTER = kind in {all: 1, talk: 1, event: 1} ? kind : "all";
  [...document.querySelectorAll("#logtabs button")].forEach(b => b.classList.toggle("on", b.dataset.lf === LOGFILTER));
  LOGSIG = null; renderLog();                                  // 換頁籤＝重畫（清掉快取簽名）
}
function renderLog(){
  const _all = V.log || [];
  const all = LOGFILTER === "all" ? _all
    : _all.filter(e => LOGFILTER === "talk" ? TALK_TYPES.includes(e.type) : !TALK_TYPES.includes(e.type));
  const el = $("log");
  const sig = [LANG, LOGFILTER, V.you ? V.you.seat : "", all.length, (all[all.length-1] || {}).seq, !!MAP, seatsList().map(s=>s.name).join(","), LOGALL].join("|");
  if(sig === LOGSIG) return;
  LOGSIG = sig;
  const stick = !el.dataset.init || el.scrollHeight - el.scrollTop - el.clientHeight < 48;   // 在看历史时别把人拽回底部
  const anchor = !stick && Array.from(el.children).find(n => n.dataset.eventSeq && n.getBoundingClientRect().bottom > el.getBoundingClientRect().top);
  const anchorSeq = anchor && anchor.dataset.eventSeq;
  const anchorOffset = anchor ? anchor.getBoundingClientRect().top - el.getBoundingClientRect().top : 0;
  const oldTop = el.scrollTop;
  LAST_SCENE_NO = null;
  const hidden = LOGALL ? 0 : Math.max(0, all.length - LOGN);
  all.slice(0, hidden).forEach(e => { if(e.scene_no != null) LAST_SCENE_NO = e.scene_no; if(e.type === "scene_open" && e.no != null) LAST_SCENE_NO = e.no; });   // 收起的部分也要記景號
  const lg = all.slice(hidden);
  const tog = hidden ? `<button class="ghost sm logmore" onclick="logToggle()">${esc(t("log_more",{n:hidden}))}</button>`
    : (LOGALL && all.length > LOGN) ? `<button class="ghost sm logmore" onclick="logToggle()">${esc(t("log_less"))}</button>` : "";
  let prevKick = "";   // 连续对同一席的「提醒」只留一条（agent 被戳醒时会连发，淹没真正的动作）
  const rows = lg.map(e => {
    if(e.type === "kick"){ if(prevKick === e.seat) return ""; prevKick = e.seat; }
    else if(!["throttle_tick","tower_turn","acted"].includes(e.type)) prevKick = "";
    try{ return fmt(e).replace(/^<div/, `<div data-event-seq="${esc(e.seq)}"`); }catch(err){ return ""; }
  });
  el.innerHTML = tog + rows.join("");
  el.querySelectorAll(".enote").forEach(note => { note.title = note.textContent; });
  el.dataset.init = "1";
  if(stick){
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(()=>{
      if(el.scrollHeight - el.scrollTop - el.clientHeight < 48) el.scrollTop = el.scrollHeight;
    });
  }
  else {
    el.scrollTop = oldTop;
    const node = anchorSeq && Array.from(el.children).find(n => n.dataset.eventSeq === anchorSeq);
    if(node) el.scrollTop += node.getBoundingClientRect().top - el.getBoundingClientRect().top - anchorOffset;
  }
  $("loghint").textContent = `#${(lg[lg.length-1] || {}).seq || 0}`;
}

/* ------------------------------- 渲染 ------------------------------- */
/* 本景還剩幾次＝引擎給的 limits − used（只是把 view 的兩個數字並排成一個，不判規則）；沒有額度資料就 null */
function left(kind){
  const th = V && V.throttle; if(!th || !th.limits || th.limits[kind] == null) return null;
  return Math.max(0, th.limits[kind] - ((th.used || {})[kind] || 0));
}
const quotaChip = () => {
  const th = V && V.throttle; if(!th || !th.limits) return "";
  return t("quota_chip", {a:left("act"), s:left("say")});
};
/* 席位的位置：塔内且 hidden_floor 的人只写「塔内」，绝不外露层数（红线 5） */
function locOf(id){
  const B = (V && V.board) || {};
  if(isMe(id)) return B.you_are ? nodename(B.you_are) : "";
  const p = (B.party || []).find(x => x.seat === id);
  if(!p) return "";
  if(p.hidden_floor) return t("in_tower");                      // 塔內不外露層數（紅線 5）：連 node 都不看
  const nd = p.node && ((MAP && MAP.nodes) || []).find(x => x.id === p.node);
  return nd ? nodename(nd) : locf(p, "where");
}
/* 公開名冊（board.roster）：先對席位 id，對不到再對角色名（名冊本身是公開資料，不是推斷私密） */
function rosterOf(seat, name){
  const R = ((V && V.board) || {}).roster || [];
  return R.find(r => r.seat === seat) || (name ? R.find(r => r.name === name) : null) || null;
}
const rosterText = r => r ? [gl(r.faction), gl(r.role)].filter(Boolean).join("・") : "";
function lastActOf(id){
  const lg = V.log || [];
  for(let i = lg.length - 1; i >= 0; i--) if(lg[i].type === "action_declared" && lg[i].seat === id) return actPhrase(lg[i]);
  return "";
}
function bar(cls, pct, val, max){
  const low = (val!=null && max) ? (val/Math.max(1,max) < .34) : false;
  return `<span class="bar2 ${cls}${low?" low":""}" style="width:72px"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></span>`;
}
/* 角色状态栏：谁（玩家/AI/NPC）· 本景出手了没 · HP / 在哪 · 最近做了什么 */
function charBar(s){
  const self = isMe(s.seat);
  const ros = rosterOf(s.seat, s.name);
  const pct = 100*s.hp/Math.max(1,s.max_hp);
  const w8 = V.scene_waiting, G = V.stage;

      <span class="k${s.kind==="agent"?" pur":""}">${esc(L("kind_"+s.kind) || s.kind)}</span>${tag}
      ${(s.status||[]).length?`<span class="k" style="color:var(--bad)">${esc(s.status.map(loc).join("、"))}</span>`:""}
      <span class="kv2">${IC("heart")}${bar("hp",pct,s.hp,s.max_hp)}<span>${s.hp}/${s.max_hp}</span></span></div>
    <div class="cb2">${loc_?`<span class="k gold">${IC("pin")}${esc(loc_)}</span>`:""}${rt?`<span>${esc(rt)}</span>`:""}
      ${la?`<span class="la">${esc(t("last_act"))}：${la}</span>`:""}</div>
  </div>`;
}

/* ---------------- 我的狀態（HUD） ----------------
   第一屏要一眼看到：還能行動幾次（最大）／HP／記憶／貨幣／三屬性／狀態／神器／碎片／在哪。
   每一格都能點：底下那行說明它是什麼（新手不必先讀規則）。只用 you.* / throttle / you_acted / your_fragments / board.you_are。 */
let HUDTIP = null, HUDPREV = {}, HUDBUMP = {};
const pipsOf = (on, total, cls="") => total > 0 ? `<span class="pips ${cls}">` +
  Array.from({length:total}, (_, i) => `<i class="${i < on ? "f" : ""}"></i>`).join("") + `</span>` : "";
function renderHud(){
  const box = $("hud"), you = V.you;
  box.style.display = you ? "block" : "none";
  if(!you){ HUDPREV = {}; setHTML(box, ""); return; }
  const G = V.stage, open = !!(G && G.open), th = V.throttle || {}, lim = th.limits || {};
  const al = left("act"), sl = left("say");
  /* 數值變了就跳一下；class 留 0.8 秒（動畫長度），免得緊接著的輪詢重繪把動畫砍掉 */
  const bump = (k, v) => { if(HUDPREV[k] !== undefined && HUDPREV[k] !== v) HUDBUMP[k] = Date.now(); HUDPREV[k] = v;
    return Date.now() - (HUDBUMP[k] || 0) < 800 ? " bump" : ""; };
  /* ── 頂條：名字・派系定位 ＋ 狀態 ── */
  const ros = rosterOf(you.seat, you.name) || you.roster;
  const st = (you.status || []).map(loc).filter(Boolean);
  const stHtml = st.length
    ? st.map(x => `<button class="hchip cell bad${HUDTIP==="status"?" on":""}" data-tip="status">${IC("warn")}${esc(x)}</button>`).join("")
    : `<button class="hchip cell good${HUDTIP==="status"?" on":""}" data-tip="status">${IC("check")}${esc(t("status_ok"))}</button>`;
  let h = `<div class="hudtop">${IC("user","lg")}<div class="who2"><span class="nm">${esc(you.name)}</span>` +
    `<span class="rl">${esc(rosterText(ros) || L("kind_"+you.kind) || "")}${open ? " ・ " + esc(t(V.you_acted ? "acted_yes" : "acted_no")) : ""}</span></div>${stHtml}</div>`;
  /* ── 主區：左＝還能行動（最大）；右＝HP／記憶／貨幣 ── */
  const actSub = al == null ? "" : !open ? t("act_left_closed") : al === 0 ? t("act_left_out") : V.you_acted ? t("act_left_more") : t("act_left_go");
  const tile = `<button class="acttile cell${open && al > 0 ? " go" : ""}${al === 0 || !open ? " zero" : ""}${HUDTIP==="act"?" on":""}" data-tip="act">` +
    `<span class="atl">${IC("bolt")}${esc(t("act_left"))}</span>` +
    `<span class="atn"><b class="${bump("al", al)}">${al == null ? "—" : al}</b><small>${esc(t("times"))}</small></span>` +
    pipsOf(al || 0, lim.act || 0) +
    (actSub ? `<span class="atsub">${esc(actSub)}</span>` : "") +
    (sl != null ? `<span class="atsay">${IC("speech")}${esc(t("say_left",{n:sl}))}</span>` : "") + `</button>`;
  const stat = (cls, key, ic, label, pct, val, low) =>
    `<button class="stat cell ${cls}${low?" low":""}${HUDTIP===key?" on":""}" data-tip="${key}"><span class="sl">${IC(ic)}${esc(label)}</span>` +
    `<b class="${bump(key, val)}">${esc(val)}</b>` +
    (pct == null ? "" : `<span class="meter"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></span>`) + `</button>`;
  /* ── 有上下限的數值用**橫棒**（設計者 2026-10-07：「hp 記憶 魔力 經驗 這類包含上下限的數值不要小格子」）──
     · HP：`hp/max_hp`（真上限） · 經驗：`exp/next_need`（真上限）
     · 記憶／魔力：view 這一版**沒有上限欄位**（只給當前值）⇒ 棒以 100 為滿格＝「量感」，數字一律以 view 為準
     · 沒有上限的（貨幣／★／行動格…）保持小格子；點棒一樣會出說明（沿用既有的 data-tip 機制）。 */
  const bar = (cls, key, ic, label, cur, max, txt) => {
    const pct = (max > 0) ? Math.round(100 * cur / max) : cur;
    const p = Math.max(0, Math.min(100, Math.round(pct)));
    return `<button class="hudbar ${cls}${p < 25 ? " low" : ""}${HUDTIP===key?" on":""}" data-tip="${key}">` +
      `<span class="bl">${IC(ic)}${key === "lvl" && !MQ.matches ? `<span class="level-medal">${esc(you.level)}</span>${esc(t("lvl_chip",{n:""}))}` : esc(label)}</span><span class="bt"><i style="width:${p}%"></i></span>` +
      `<b class="${bump(key, cur)}">${esc(txt)}</b></button>`;
  };
  let bars = "";
  bars += bar("bar-hp", "hp", "heart", t("hp"), you.hp, you.max_hp, `${you.hp}/${you.max_hp}`);
  /* 上限由桌子給（`you.max_memory`／`you.max_mana`）；桌子沒給才退回「以 100 為滿格」的量感畫法。 */
  if(you.memory != null)
    bars += bar("bar-mem", "mem", "mind", t("memory"), you.memory, (you.max_memory || 100),
      you.max_memory ? `${you.memory}/${you.max_memory}` : String(you.memory));
  if(((you.resources || {}).mana) != null)
    bars += bar("bar-mana", "res", "bolt", t("mana"), you.resources.mana, (you.max_mana || 100),
      you.max_mana ? `${you.resources.mana}/${you.max_mana}` : String(you.resources.mana));
  if(you.level != null)
    bars += bar("bar-lvl", "lvl", "star", t("lvl_chip",{n:you.level}), you.exp || 0, you.next_need || 0,
      you.next_need != null ? t("exp_chip",{e:you.exp, n:you.next_need}) : t("exp_max",{e:you.exp}));

  const BAR_KEYS = ["mana"];
  const RR = you.resources || {};
  const rk = Object.keys(RR).filter(k => RR[k] != null && BAR_KEYS.indexOf(k) < 0);
  if(rk.length)
    stats += stat("res", "res", "star", t("res_chip"), null,
      rk.map(k => `${esc(L("res_"+k) || k)} ${esc(String(RR[k]))}`).join(" · "), false);
  /* 星等（升星＝劇情事件觸發）：只有真的有星等紀錄才畫（★n／上限＋下一星的稱號掛 tooltip） */
  if(you.star && you.star.star != null)
    stats += stat("star", "star", "sparkle", t("star_chip"), null,
      `${you.star.star}${you.star.max ? "/" + you.star.max : ""}`, false);
  /* 等級／經驗已經在**經驗棒**上（`Lv n · 經驗 e/need`）⇒ 這裡不再畫小格子，免重複。 */
  /* ── 三屬性：數字＋點點（入座時是 1～5）；跟 HP／記憶／貨幣排成右邊的 3×2 小格 ── */
  const A = you.attrs || {};
  /* ⚠ 屬性清單要**跟著桌子的屬性表**：現役那張有第四項 `luck`（運）——照前三項同一種寫法加上
     （描述沿用既有的 `tip_attr`：點一下就會說明；沒有的桌 `A.luck == null` ⇒ 這格不畫）。 */
  /* 屬性清單**跟著桌子**（`V.rules_attrs`；沒露＝預設三項）；值不在資料裡就標「—」（誠實）。 */
  const AICON = {str:"sword", agi:"walk", wil:"target", luck:"coins"};
  const AKEYS = (V.rules_attrs && V.rules_attrs.length) ? V.rules_attrs : ["str","agi","wil"];
  const attrs = AKEYS.map(k => {
    const v = A[k], lab = (t("attr_"+k) === "attr_"+k) ? k : t("attr_"+k);
    const ic = AICON[k] || "dice";
    return `<button class="attr cell${HUDTIP==="attr_"+k?" on":""}" data-tip="attr_${k}">` +
      `<span class="al">${IC(ic)}${esc(lab)}</span><b>${v == null ? "—" : esc(v)}</b>` +
      (v == null ? "" : pipsOf(v, Math.max(5, v))) + `</button>`;
  }).join("");
  h += `<div class="hudbd">` +
    (bars ? `<div class="hudbars">${bars}</div>` : "") +   /* 棒在 hudmain 外面：吃滿整張卡寬 */
    `<div class="hudmain">${tile}` +
    (!MQ.matches ? `</div><div class="hud-detail"><div class="cells">${stats}</div>` : `<div class="cells">${stats}</div></div>`) +          /* 屬性也放 hudmain **外面**：才吃得到整張卡寬 */
    (attrs ? `<div class="attrs">${attrs}</div>` : "");
  /* ── 在哪 ＋ 身上的東西（神器／碎片） ── */
  const H = (V.board || {}).you_are;
  let row = "";
  if(H) row += `<button class="hchip cell loc${HUDTIP==="loc"?" on":""}" data-tip="loc">${IC("pin")}<b>${esc(nodename(H))}</b></button>`;
  const arts = {};
  (you.artifacts || []).forEach((a, i) => { const k = gl(a.name) + "|" + a.tier; (arts[k] = arts[k] || {a, i, n:0}).n++; });
  const ak = Object.keys(arts);
  row += ak.length
    ? ak.map(k => { const x = arts[k]; return `<button class="hchip cell gold${HUDTIP==="art_"+x.i?" on":""}" data-tip="art_${x.i}">${IC("sparkle")}${esc(gl(x.a.name))}` +
        ` <span>${IC("star")}${esc(x.a.tier)}</span>${x.n > 1 ? ` ×${x.n}` : ""}</button>`; }).join("")
    : `<button class="hchip cell${HUDTIP==="art"?" on":""}" data-tip="art">${IC("sparkle")}${esc(t("no_art"))}</button>`;
  /* ★2：身上的道具（有才畫；最多 4 個＋「…+N」） */
  const yit = (you.items || []).filter(x => x.count > 0);
  if(yit.length) row += yit.slice(0, 4).map(x =>
    `<button class="hchip cell">${IC("cart")}${esc(gl(x.name_jp || x.id))}` +
    `${x.count > 1 ? ` <span>×${esc(x.count)}</span>` : ""}</button>`).join("") +
    (yit.length > 4 ? `<button class="hchip cell">…+${esc(yit.length - 4)}</button>` : "");

  if(Array.isArray(fr)) row += `<button class="hchip cell${fr.length?" gold":""}${HUDTIP==="frag"?" on":""}" data-tip="frag"${fr.length?' onclick="gotoFrags()"':""}>${IC("piece")}${esc(t("frag_n",{n:fr.length}))}</button>`;
  /* 判了結局 ⇒ 不再給「結算／戰況」：結局卡（endbar）已經把同樣的數字寫在上面，而且會蓋住它 */
  if(!V.ended) row += `<button class="hchip cell" onclick="toggleSum(true)">${IC("piece")}${esc(t("sum_title"))}</button>`;
  else if(SUMOPEN) toggleSum(false);
  h += `<div class="hudrow">${row}</div>`;
  if(!MQ.matches) h += `</div>`;
  /* ── 說明列：點了哪一格就說明哪一格 ── */
  if(HUDTIP) h += `<div class="hudtip">${hudTip(HUDTIP)}</div>`;
  else if(rhythmOn()) h += `<div class="hint">${esc(t("tip_tap"))}</div>`;
  h += `</div>`;
  setHTML(box, h);
}
function hudTip(k){
  const you = V.you || {};
  if(k === "act") return t("tip_act") + " " + t("tip_say");
  if(k === "hp") return t("tip_hp");
  if(k === "mem") return `<b>${esc(t("memory"))}</b>：` + esc(t("mem_hint"));
  if(k === "coin") return t("tip_coin");
  if(k === "status") return t("tip_status");
  if(k === "loc") return t("tip_loc") + (((V.board || {}).you_are || {}).type ? " " + esc(L("ntype_" + V.board.you_are.type) || "") : "");
  if(k === "frag") return t("tip_frag");
  if(k.startsWith("attr_")){
    const own = t("tip_" + k);                    /* 例：tip_attr_luck（有專屬說法就用它） */
    return (own !== "tip_" + k) ? own : t("tip_attr", {name: esc(t(k))});
  }
  if(k.startsWith("art")){
    const a = (you.artifacts || [])[+k.slice(4)];
    if(!a) return t("tip_art");
    const d = locf(a, "desc"), hd = a.revealed ? locf(a, "hidden") : "";
    return t("tip_art") + `<br><b>${esc(gl(a.name))}</b> ${IC("star")}${esc(a.tier)}` + (d ? "：" + esc(d) : "") +
      (hd ? `<br><span style="color:var(--star)">${esc(t("artifact_hidden"))}：${esc(hd)}</span>` : "");
  }
  return "";
}
$("hud").addEventListener("click", e => {
  const b = e.target.closest("[data-tip]"); if(!b) return;
  HUDTIP = HUDTIP === b.dataset.tip ? null : b.dataset.tip;
  renderHud();
});
/* 「現在想做什麼？」在手機上固定在底部（#dock，跟發言列一起）；桌機搬回右欄原位。--dock-h 跟著實際高度走 */
const MQ = matchMedia("(max-width:979px)");
/* 頂欄整理：手機把「地圖」鈕搬進 .bar（原本是 fixed 浮在頂欄右側，會壓住別的鈕）；

const MAPFAB = document.getElementById("mapfab");
const MAPFAB_HOME = MAPFAB ? MAPFAB.parentNode : null;
function placeMapFab(){
  /* 2026-10-19（設計者）：「PC 佈局也會遮擋」——固定偏移在任何寬度都可能壓到別顆鈕。
     ⇒ 一律把地圖鈕放進頂欄（桌機排在「大廳」前、手機排在「帳號」前），
       位置交給 flex 排版，**不再有任何硬編位移**。 */
  if(!MAPFAB) return;
  const bar = document.querySelector(".bar");
  if(!bar || !bar.contains(MAPFAB) ){
    const lobby = document.getElementById("lobbyhome"), auth = document.getElementById("authopen");
    const before = (lobby && getComputedStyle(lobby).display !== "none") ? lobby : (auth || null);
    if(before) bar.insertBefore(MAPFAB, before); else bar.appendChild(MAPFAB);
  }
}
placeMapFab();

/* ── 私訊（MOMOTALK 式）：對象＝GM＋其他玩家；內容＝your_secrets 裡與該對象的往來 ── */
let MOMO_TO = "", MOMO_SHOWN = false;
let MOMO_SEEN = Number(localStorage.getItem("trpg_momo_seen") || 0);
function momoPeers(){
  const gm = [{seat:"gm", name:"GM"}];
  /* ⚠ 排除「我」要用**桌給的事實**（`V.you.seat`），不是頁面的 `SEAT` 變數——
     SEAT 可能沒設／過期（那時名單裡就會出現自己）（owner 2026-10-08：「私聊对象不应该包含我自己」）。 */
  const me = (V && V.you && V.you.seat) || SEAT || "";
  const ps = seatsList().filter(s=>me && s.seat!==me && isPlayerSeat(s.kind))
                        .map(s=>({seat:s.seat, name:s.name}));
  return gm.concat(ps);
}
function momoThread(seat){
  return (V.your_secrets||[]).filter(s=>{
    if(s.from === SEAT) return (s.peer || "") === seat;   // 我送出去的
    return s.from === seat;                                // 對方送來的
  }).map(s=>({mine: s.from === SEAT, seq: s.seq, text: s.text, ts: s.ts || 0}));
}
function momoUnreadBy(){ 
  const m = {};
  (V.your_secrets||[]).forEach(s=>{ if(s.from !== SEAT && (s.seq||0) > MOMO_SEEN) m[s.from] = (m[s.from]||0)+1; });
  return m;
}
function momoBadge(){
  const b = $("momobtn"), d = $("momobdg");

  if(d){
    const n = Object.values(momoUnreadBy()).reduce((a,c)=>a+c, 0);

/* 對話串尾巴的狀態列：GM 在思考（問了還沒回）／對方正在輸入（同桌 ping 過來、6 秒內算數） */
function momoTypingFor(seat){
  const ty = (V.typing || {})[seat];
  const fresh = ty && (Date.now()/1000 - (ty.ts || 0) < 6)
                && (!ty.to || ty.to === SEAT || ty.to === MOMO_TO);
  if(fresh) return seat === "gm" ? t("gm_thinking") : t("momo_typing");
  if(seat === "gm") return gmThinking() ? t("gm_thinking") : "";   // 桌端沒訊號時退回「我問了、還沒回」
  return "";
}
function momoTime(ts, clockOnly){
  const d = new Date((ts || 0) * 1000);
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  return clockOnly ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
let MOMO_PING_AT = 0;
function momoPing(){
  if(!SEAT || !MOMO_TO) return;
  const now = Date.now(); if(now - MOMO_PING_AT < 2500) return;   // 2.5 秒最多一次
  MOMO_PING_AT = now;
  api("/api/typing", {seat: SEAT, to: MOMO_TO});
}
function momoSeen(){
  const mx = Math.max(0, ...(V.your_secrets||[]).map(s=>s.seq||0));
  if(mx > MOMO_SEEN){ MOMO_SEEN = mx; localStorage.setItem("trpg_momo_seen", String(mx)); }
  momoBadge();
}

/* 頭像：GM＝字標；玩家＝素材表的 avatar（查不到＝名字第一個字） */

  if(seat === "gm") return `<span class="momo-av gm${cls ? " " + cls : ""}">GM</span>`;
  const p = seatsList().find(s => s.seat === seat) || (V && V.you && V.you.seat === seat ? V.you : {seat});

function momoOpen(){ MOMO_SHOWN = true; if(!MOMO_TO) MOMO_TO = "gm"; MOMO_VIEW = "thread"; $("momobox").classList.add("on"); momoRender(); }
function momoClose(){ MOMO_SHOWN = false; $("momobox").classList.remove("on"); momoSeen(); }

function momoList(){ MOMO_VIEW = MOMO_VIEW === "list" ? "thread" : "list"; momoRender(); }
function momoRender(){
  const ppl = $("momoppl"); if(!ppl) return;
  const box = $("momobox"), un = momoUnreadBy(), peers = momoPeers();
  const list = MOMO_VIEW === "list";
  box.classList.toggle("view-list", list);
  ppl.classList.toggle("list", list);
  const lb = $("momolistbtn"); if(lb) lb.setAttribute("aria-pressed", String(list));
  const others = Object.keys(un).filter(k => k !== MOMO_TO).reduce((a, k) => a + un[k], 0);
  const ln = $("momolistn"); if(ln){ ln.style.display = others ? "" : "none"; ln.textContent = others > 9 ? "9+" : String(others); }
  const peer = peers.find(p => p.seat === MOMO_TO) || {};
  setHTML($("momoav"), list ? "" : momoAvatar(MOMO_TO));
  $("momottl").textContent = list ? t("momo") : (peer.name || t("momo"));
  $("momowho").textContent = list ? t("momo_pick") : t("momo_private");
  if(list){
    setHTML(ppl, peers.map(p => {
      const th = momoThread(p.seat), last = th[th.length - 1], n = un[p.seat] || 0;
      const pre = last ? String(last.text || "").replace(/\s+/g, " ").slice(0, 60) : "";
      return `<button type="button" class="momo-row${p.seat === MOMO_TO ? " on" : ""}" onclick="momoPick('${esc(p.seat)}')">` +
        `<span class="momo-avw">${momoAvatar(p.seat)}${n ? `<span class="momo-dot">${n > 9 ? "9+" : n}</span>` : ""}</span>` +
        `<span class="momo-rc"><b>${esc(p.name)}</b><small>${esc(pre || " ")}</small></span></button>`;
    }).join(""));
    return;
  }
  const lg = $("momolog"), th = momoThread(MOMO_TO);
  const ty = momoTypingFor(MOMO_TO);
  const stick = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 40;   // 你已經滑上去了就別硬拉回底
  /* 先排出「分隔線／新訊息線／訊息」的序列，再決定每句是不是一串的最後一句（最後一句才帶頭像與尾巴） */
  const items = [];
  let prev = 0, unreadDone = false;
  th.forEach(m => {
    if(m.ts && (!prev || m.ts - prev > 300)) items.push({sep: momoTime(m.ts)});
    if(!unreadDone && !m.mine && m.seq > MOMO_SEEN){ items.push({sep: t("momo_new"), cls: "new"}); unreadDone = true; }
    items.push({m});
    prev = m.ts || prev;
  });
  const me = (V && V.you && V.you.seat) || SEAT || "";
  let html = "";
  items.forEach((it, k) => {
    if(it.sep){ html += `<div class="momo-day${it.cls ? " " + it.cls : ""}">${esc(it.sep)}</div>`; return; }
    const m = it.m, nx = items[k + 1];
    const last = !nx || !nx.m || nx.m.mine !== m.mine;
    const who = m.mine ? me : MOMO_TO;
    html += `<div class="momo-line ${m.mine ? "me" : "you"}${last ? " last" : ""}">${momoAvatar(who, last ? "" : "sp")}` +
      `<div class="momo-m ${m.mine ? "me" : "you"}">${TX(m.text)}` +
      (m.ts ? `<span class="momo-t">${momoTime(m.ts, true)}</span>` : "") + `</div></div>`;
  });
  const changed = setHTML(lg, (html || `<div class="hint">${esc(t("momo_empty"))}</div>`)
    + (ty ? `<div class="momo-line you typing last">${momoAvatar(MOMO_TO)}<div class="momo-m typing">${esc(ty)}<i></i><i></i><i></i></div></div>` : ""));
  if(changed && (stick || !th.length)) lg.scrollTop = lg.scrollHeight;
}
async function momoSend(){
  const i = $("momotext"); if(!i) return;
  const txt = (i.value || "").trim();
  if(!txt) return;                        /* 空白不送（既有行為） */
  if(!MOMO_TO) return;                    /* 沒選對象（開窗一定有預設 gm ⇒ 幾乎不會發生） */
  i.value = "";
  /* ⚠ **不准靜默失效**（owner 2026-10-08 實測：按發送「沒反應、也沒有任何提示」，但收訊正常）。
     舊寫法 `if(!txt || !SEAT || !MOMO_TO) return;` —— `SEAT` 只是顯示記號（身分一律只認 token：
     `api()` 有 token 時會把 seat 拿掉、伺服器以 token 的席位為準），憑證進場的頁面 SEAT 一向是空的
     ⇒ 整顆按鈕靜默 no-op。現在：一律送出去，**伺服器回答什麼就顯示什麼**。 */
  const r = await api("/api/tell", {seat: SEAT || "", to: MOMO_TO, text: txt});
  if(r && r.ok){
    if(MOMO_TO === "gm"){ GMWAIT_AT = Date.now(); GMWAIT_FROM = GM_SEEN; }   // 讓對話串顯示「GM 思考中…」
    await poll(); momoRender(); momoSeen();
  }
  else alert(errOf(r) || t("conn_lost"));   /* 送不出去也要說原因（斷線／沒席位／規則拒絕…） */
}

function syncLeftStack(){

/* 桌機景文卡的可用高度＝日誌卡的頂 − 景文卡的頂（結局／暫停橫幅在景文上面，會把它往下推）。
   超出就卡內捲動（CSS `#scenetx.fit`）；`.more`＝下面還有字（底邊淡出）。景文只在內容變了才重寫 ⇒ 捲到哪裡輪詢不會跳回去。 */
function syncSceneFit(){
  const tx = $("scenetx"), log = $("storycard");
  if(!tx) return;
  if(MQ.matches || !log || !log.getClientRects().length || tx.style.display === "none"){
    tx.style.removeProperty("max-height"); tx.classList.remove("fit", "more"); return;
  }
  const room = Math.floor(log.getBoundingClientRect().top - tx.getBoundingClientRect().top - 12);
  const want = Math.max(40, room) + "px";          // 矮視窗（例 1000×570＋暫停橫幅）只剩兩行也照樣讓開，卡內捲
  if(tx.style.maxHeight !== want) tx.style.maxHeight = want;
  tx.classList.add("fit");
  sceneMore(tx);
  if(!tx._fitScroll){ tx._fitScroll = true; tx.addEventListener("scroll", () => sceneMore(tx), {passive: true}); }
}
function sceneMore(tx){ tx.classList.toggle("more", tx.scrollTop + tx.clientHeight < tx.scrollHeight - 2); }

function syncDesktopMap(){
  const desktop=!MQ.matches,box=$("mapbox"),head=$("mapdrag");
  box.classList.toggle("map-collapsed",desktop && !MAPOPEN);
  $("cta").classList.toggle("map-folded",desktop && !MAPOPEN);
  head.setAttribute("aria-expanded",String(MAPOPEN));
  const cta=$("cta"),copy=$("scenetx").querySelector(".scene-copy");
  const world=cta.querySelector(".scene-world");
  const occupied=[...cta.children].filter(e=>e!==box && e.offsetHeight).reduce((total,e)=>{
    const style=getComputedStyle(e);
    return total+e.offsetHeight+(e===world ? 0 : parseFloat(style.marginTop)||0)+(parseFloat(style.marginBottom)||0);
  },0);
  const overlay=desktop && MAPOPEN && cta.clientHeight-occupied<220;
  box.classList.toggle("map-overlay",overlay);
  if(overlay && copy){
    const worldHeight=((world ? world.offsetHeight : 74)+6)+"px";
    cta.style.setProperty("--map-world-height",worldHeight);
    const end=(copy.getBoundingClientRect().bottom-cta.getBoundingClientRect().top+12)+"px";
    if(cta.style.getPropertyValue("--map-copy-end")!==end){cta.style.setProperty("--map-copy-end",end);requestAnimationFrame(renderMap);}
  }
  if(desktop){
    head.setAttribute("role","button");head.tabIndex=0;
    $("mapname").textContent=V && V.board && V.board.you_are ? nodename(V.board.you_are) : "";
    let indicator=head.querySelector(".map-fold-indicator");
    if(!indicator){indicator=document.createElement("span");indicator.className="map-fold-indicator";indicator.setAttribute("aria-hidden","true");head.append(indicator);}
    head.setAttribute("aria-label",t("map")+" · "+$("mapname").textContent+" · "+t(MAPOPEN ? "map_hide" : "map_show"));
  }else{head.removeAttribute("role");head.removeAttribute("tabindex");head.removeAttribute("aria-label");head.removeAttribute("aria-expanded");}
}

function renderRecap(){
  const cta = $("cta"), host = cta.parentNode;
  let box = host.querySelector(".return-recap");
  if(box && box.open) return;
  const events = (V.log || []).filter(e => Number.isFinite(Number(e.seq)));
  const newest = Math.max(0,...events.map(e=>Number(e.seq)));
  const stored = localStorage.getItem("trpg_lastseen");
  if(stored === null){ localStorage.setItem("trpg_lastseen",String(newest)); if(box) box.remove(); return; }
  const seen = Math.max(0,Number(stored)||0);
  const pending = events.filter(e=>Number(e.seq)>seen);
  const meaningful = pending.filter(e=>!["throttle_tick","tower_turn","acted","kick"].includes(e.type));
  const unread = (meaningful.length ? meaningful : pending).slice().sort((a,b)=>b.seq-a.seq);
  if(newest <= seen){ if(box) box.remove(); return; }
  if(!box){ box=document.createElement("details"); box.className="return-recap"; host.insertBefore(box,cta); }
  const me = V.you && V.you.seat;
  const own = events.filter(e=>e.type==="action_declared" && e.seat===me).sort((a,b)=>b.seq-a.seq)[0];
  const gm = unread.find(e=>["gm_say","scene_set"].includes(e.type) || (e.type==="say" && e.seat==="gm"));
  const action = own && (L("act_"+own.action) || t("recap_event"));
  const lead = gm ? (own && gm.seq>own.seq ? t("recap_after",{action}) : t("recap_gm")) : t("recap_count",{n:unread.length || 1});
  const plain = html => { const span=document.createElement("span");span.innerHTML=html;return span.textContent; };
  const describe = e => {
    const text=locf(e,"text") || locf(e,"note"); if(text) return text;
    if(e.type==="action_declared") return NM(e.seat)+" · "+(L("act_"+e.action)||t("recap_event"));
    if(e.type==="roll") return NM(e.seat)+" · "+plain(rollText(e));
    if(e.type==="damage") return NM(e.target)+" · "+t("lg_damage",{n:e.amount,hp:e.hp_after});
    if(e.type==="heal") return NM(e.seat)+" · "+t("lg_heal",{n:e.amount,hp:e.hp_after});
    if(e.type==="memory_change") return NM(e.seat)+" · "+t("lg_memory",{a:e.before,b:e.after});
    if(e.type==="search_loot") return NM(e.seat)+" · "+plain(t("lg_loot",{node:esc(nodeLabel(e.node,e.seat))}));
    if(e.type==="artifact_gained") return NM(e.seat)+" · "+plain(t("lg_artifact",{name:esc(gl(e.name)),tier:e.tier,cost:e.memory_cost}));
    if(e.type==="scene_open" || e.type==="scene_close") return t("recap_scene");
    return t("recap_event");
  };
  box.innerHTML = `<summary><b>${esc(t("recap_title"))}：</b>${esc(lead)} ${gm && unread.length>1 ? esc(t("recap_more",{n:unread.length-1})) : ""}<span class="recap-chevron" aria-hidden="true"></span></summary>` +
    `<div class="recap-body"><p class="hint">${esc(t("recap_read"))}</p>` + unread.map(e=>`<p><small>#${esc(e.seq)}</small> ${esc(describe(e))}</p>`).join("") + `</div>`;
  box.ontoggle = () => {
    if(box.open) localStorage.setItem("trpg_lastseen",String(newest));
    else { box.remove(); renderRecap(); }
  };
}

/* 本回合剩餘時間（2026-10-06 設計者：「暫停時倒計時也凍住」）。

    scene.querySelectorAll(".asset-bg,.asset-portrait,.asset-crowd").forEach(e=>e.remove());
    scene.classList.remove("has-scene-art");scene._assetScene=bg;scene._assetWanted={};
  }
  if(scene && bg && (scene===HUD_ART || scene.style.display!=="none")){
    attachAsset(scene,"scene-bg",bg,"asset-bg");
    loadedAsset(bg).then(source=>{if(!source || ASSET_CONTEXT!==ctx || scene._assetScene!==bg) return;
    if(MQ.matches) attachAsset(scene,"scene-portrait",charArt("portrait",you),"asset-portrait");
    const id=String(here.id || ""),seed=Array.from(id).reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0);
    const pattern=here.type==="city" || here.type==="village" ? /^(resident_|gold_a|guard_)/ : here.type==="wild" ? /^trekker_/ : /^(resident_|girl_|elder_f)/;
    const pool=Object.keys(ctx.index.aliases).filter(k=>k.startsWith("crowd:") && pattern.test(k.slice(6))).sort();
    if(!id.startsWith("special_") && !String(bg).includes("/special_") && pool.length){
      [0,1].forEach(i=>attachAsset(scene,"scene-crowd-"+i,assetAlias(pool[(seed+i)%pool.length]),"asset-crowd crowd-"+i));
    }
    });
  }
  if(scene===HUD_ART){
    const actor=(V.turn && V.turn.seat && seatsList().find(s=>s.seat===V.turn.seat)) || you;
    const wanted=charArt("portrait",actor),own=charArt("portrait",you),token=String(actor.seat || "")+"|"+wanted+"|"+own;
    if(scene._portraitToken!==token){scene._assetWanted=scene._assetWanted || {};scene._assetWanted["scene-portrait"]="";}
    scene._portraitToken=token;
    const choose=async()=>{
      const primary=wanted && await loadedAsset(wanted);
      const url=primary ? wanted : (own && await loadedAsset(own) ? own : "");
      if(ASSET_CONTEXT===ctx && scene._portraitToken===token && !MQ.matches) attachAsset(scene,"scene-portrait",url,"asset-portrait");
    };
    choose();
    scene.style.display=MQ.matches ? "none" : "block";
    document.querySelectorAll(".hud-seat").forEach(card=>{
      const person=seatsList().find(s=>s.seat===card.dataset.seat);
      assetIcon(card,"hud-seat-"+card.dataset.seat,charArt("avatar",person));
    });
  }
  assetIcon(document.querySelector("#hud .hudtop"),"hud-avatar",charArt("avatar",you));
  (you.artifacts || []).forEach((a,i)=>assetIcon(document.querySelector('#hud [data-tip=art_'+i+']'),"hud-art-"+i,itemArt(a,"artifact:name")));
  const itemHosts=[...document.querySelectorAll("#hud .hudrow button")].filter(b=>b.querySelector('use[href="#i-cart"]'));
  (you.items || []).filter(a=>a.count>0).slice(0,4).forEach((a,i)=>assetIcon(itemHosts[i],"hud-item-"+i,itemArt(a,"item")));
  (you.artifacts || []).forEach((a,i)=>assetIcon(document.querySelector('#hud [data-tip=art_'+i+'] span'),"hud-art-tier-"+i,assetAlias("icon:star:"+a.tier)));
  [...document.querySelectorAll("#sheet .chip.p .k.gold")].forEach((host,i)=>assetIcon(host,"private-art-tier-"+i,assetAlias("icon:star:"+((you.artifacts || [])[i] || {}).tier)));
  [...document.querySelectorAll("#sheet .chip.p b")].forEach((host,i)=>assetIcon(host,"private-art-"+i,itemArt((you.artifacts || [])[i],"artifact:name")));
  assetIcon(document.querySelector('#hud [data-tip=star]'),"hud-star",assetAlias("icon:star:"+((you.star || {}).star || "")));
  (you.skills || []).forEach(a=>assetIcon(document.querySelector('[data-skill="'+CSS.escape(a.id)+'"]'),"skill-"+a.id,itemArt(a,"skill")));
  (here.shop_items || []).forEach(a=>assetIcon(document.querySelector('[data-k="item:'+CSS.escape(a.item || a.id)+'"] span'),"shop-"+(a.item || a.id),itemArt(a,"item")));
  attachAsset(document.querySelector(".scene-world"),"monster",assetUrl((here.monster || {}).icon,ctx.meta.base) || assetAlias("icon:monster:"+(here.monster || {}).id),"asset-icon asset-monster");
  const people=seatsList().filter(s=>isPlayerSeat(s.kind));
  [...document.querySelectorAll("#seats .cbar")].forEach((card,i)=>{
    const person=people[i];if(!person) return;
    const name=card.querySelector(".cn");if(name) attachAsset(name,"seat-avatar-"+person.seat,charArt("avatar",person),"asset-avatar");
    const host=card.querySelector(".k[style]");
    (person.status || []).forEach(id=>assetIcon(host,"seat-condition-"+person.seat+"-"+id,assetUrl((person.statusIcons || {})[id],ctx.meta.base) || assetAlias("icon:condition:"+id)));
  });
  [...document.querySelectorAll("#log .ev.say")].forEach(card=>{
    const name=card.querySelector(".who"),person=name && seatsList().find(p=>p.name===name.textContent);
    if(person) attachAsset(name,"log-avatar-"+card.dataset.eventSeq,charArt("avatar",person),"asset-avatar");
  });
  (you.status || []).forEach((id,i)=>{
    const host=document.querySelectorAll('#hud [data-tip=status]')[i];
    assetIcon(host,"hud-condition-"+id,assetUrl((you.statusIcons || {})[id],ctx.meta.base) || assetAlias("icon:condition:"+id));
  });
}
function clearAssets(){
  if(!ASSET_CONTEXT) return;
  if(ASSET_OBSERVER) ASSET_OBSERVER.disconnect();
  ASSET_CONTEXT=null;
  if(ASSET_STYLE){ASSET_STYLE.remove();ASSET_STYLE=null;}
  ASSET_NODES.forEach(record=>{record.image.remove();if(record.svg) record.svg.style.display=record.display;});
  ASSET_NODES.clear();
  const scene=$("scenetx");if(scene){scene.classList.remove("has-scene-art");scene._assetScene=undefined;scene._assetWanted={};}
  document.querySelectorAll(".asset-icon-host").forEach(e=>e.classList.remove("asset-icon-host"));
}

/* 模組用語表：view.table.assets.locale（`/assets/<模組>/locale.json?v=<mtime>`）。換了 URL 才重抓；
   抓到就整頁重套一次語言（applyLang 會重畫）。抓不到／格式不對 ⇒ 中性字樣（不炸頁面）。 */
let MODLOC_URL = "";
function normLocale(d){
  const obj = x => (x && typeof x === "object" && !Array.isArray(x)) ? x : {};
  if(!d || d.schema !== 1) return MODLOC_EMPTY;
  const text = {};
  for(const l of LANGS) text[l] = obj(obj(d.text)[l]);
  return {glossary:obj(d.glossary), places:obj(d.places), text};
}
function adoptLocale(){
  const meta = V && V.table && V.table.assets;
  const url = assetUrl(meta && meta.locale);
  if(url === MODLOC_URL) return;
  MODLOC_URL = url;
  const apply = d => {
    if(MODLOC_URL !== url) return;
    MODLOC = normLocale(d); TRGL = null;
    applyLang();
  };
  if(!url){ if(MODLOC !== MODLOC_EMPTY) apply(null); return; }
  fetch(url).then(r => r.ok ? r.json() : null).catch(() => null).then(apply);
}
function adoptAssets(){
  const meta=V && V.table && V.table.assets;
  if(!meta || !meta.index){clearAssets();return;}
  if(ASSET_CONTEXT && ASSET_CONTEXT.meta.index!==meta.index) clearAssets();
  assetIndex(meta).then(index=>{
    if(!index || !V || !V.table || !V.table.assets || V.table.assets.index!==meta.index) return;
    if(!ASSET_CONTEXT || ASSET_CONTEXT.meta.index!==meta.index){
      ASSET_CONTEXT={meta,index};
      ASSET_OBSERVER=new MutationObserver(records=>{
        if(records.every(r=>[...r.addedNodes,...r.removedNodes].every(n=>n.nodeType!==1 || n.classList.contains("asset-image")))) return;
        if(!ASSET_PENDING){ASSET_PENDING=true;requestAnimationFrame(()=>{ASSET_PENDING=false;paintAssets();});}
      });
      ASSET_OBSERVER.observe(document.querySelector(".wrap"),{childList:true,subtree:true});
    }
    paintAssets();
  });
}

loadMap().then(() => { toggleMap(MAPOPEN, true); poll(); });
setInterval(poll, 1500);
setInterval(() => { try{ renderTurnPill(); }catch(e){} }, 1000);   // 每秒只動那一格（別整頁重畫）
</script>
